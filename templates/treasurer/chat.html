{% extends "treasurer/treasurer-base.html" %}

{% block title %}Minutes - Treasurer{% endblock %}

{% block content %}

<style>
    /* ============================================================
       MINUTES PAGE — REDESIGNED
       ============================================================ */
    .minutes-page-wrap {
        padding: 24px 32px 48px;
        max-width: 1200px;
        margin: 0 auto;
    }

    /* Header */
    .mp-header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 20px 24px;
        background: linear-gradient(135deg, rgba(0,224,255,0.06), rgba(0,224,255,0.01));
        border: 1px solid rgba(0,224,255,0.15);
        border-radius: 16px;
        margin-bottom: 24px;
        position: relative;
        overflow: hidden;
        flex-wrap: wrap;
    }
    .mp-header::before {
        content: "";
        position: absolute;
        top: -60%;
        right: -5%;
        width: 240px;
        height: 240px;
        background: radial-gradient(circle, rgba(0,224,255,0.12), transparent 70%);
        pointer-events: none;
    }
    .mp-header-icon {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        background: rgba(0,224,255,0.12);
        border: 1px solid rgba(0,224,255,0.25);
        color: #00e0ff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.3rem;
        flex-shrink: 0;
        position: relative;
        z-index: 2;
    }
    .mp-header-text { position: relative; z-index: 2; }
    .mp-header-text h2 {
        font-family: 'Playfair Display', serif;
        font-size: 1.2rem;
        font-weight: 700;
        color: #e8e2d4;
        letter-spacing: -0.2px;
        margin: 0 0 4px 0;
    }
    .mp-header-text p {
        font-size: 0.8rem;
        color: rgba(255,255,255,0.45);
        margin: 0;
    }
    .mp-header-stats {
        margin-left: auto;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        position: relative;
        z-index: 2;
    }
    .mp-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 20px;
        font-size: 0.72rem;
        color: rgba(255,255,255,0.55);
        font-weight: 600;
    }
    .mp-chip i { font-size: 0.7rem; color: #00e0ff; }

    /* Editor Card */
    .minutes-editor-card {
        background: rgba(255,255,255,0.025);
        border: 1px solid rgba(255,255,255,0.07);
        border-radius: 16px;
        overflow: hidden;
        margin-bottom: 24px;
    }
    .minutes-editor-head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 22px;
        border-bottom: 1px solid rgba(255,255,255,0.06);
        background: rgba(255,255,255,0.012);
    }
    .minutes-editor-head-icon {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: rgba(0,224,255,0.1);
        color: #00e0ff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.9rem;
    }
    .minutes-editor-head-title {
        font-family: 'Playfair Display', serif;
        font-size: 1rem;
        font-weight: 700;
        color: #e8e2d4;
        margin: 0;
    }
    .minutes-editor-head-sub {
        font-size: 0.72rem;
        color: rgba(255,255,255,0.35);
        margin-top: 2px;
    }

    .minutes-textarea {
        width: 100%;
        min-height: 260px;
        padding: 22px 26px;
        background: rgba(0,0,0,0.2);
        border: none;
        border-bottom: 1px solid rgba(255,255,255,0.06);
        color: #e8e2d4;
        font-family: 'Georgia', serif;
        font-size: 0.92rem;
        line-height: 1.7;
        outline: none;
        resize: vertical;
        transition: background 0.2s;
    }
    .minutes-textarea:focus { background: rgba(0,0,0,0.3); }
    .minutes-textarea::placeholder {
        color: rgba(255,255,255,0.2);
        font-family: 'Inter', sans-serif;
        font-size: 0.85rem;
    }

    .minutes-editor-footer {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        padding: 14px 22px;
        background: rgba(255,255,255,0.012);
    }

    .btn-minutes {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 20px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 10px;
        color: rgba(255,255,255,0.75);
        font-family: 'Inter', sans-serif;
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
    }
    .btn-minutes:hover {
        background: rgba(255,255,255,0.08);
        color: #fff;
    }
    .btn-minutes.primary {
        background: linear-gradient(135deg, #00e0ff, #0088cc);
        color: #0a1a2b;
        border: none;
        box-shadow: 0 4px 14px rgba(0,224,255,0.22);
    }
    .btn-minutes.primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 22px rgba(0,224,255,0.35);
    }
    .minutes-status {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 0.72rem;
        color: rgba(255,255,255,0.4);
    }

    /* Saved list */
    .saved-minutes-section {
        background: rgba(255,255,255,0.025);
        border: 1px solid rgba(255,255,255,0.07);
        border-radius: 16px;
        overflow: hidden;
    }
    .saved-minutes-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 22px;
        border-bottom: 1px solid rgba(255,255,255,0.06);
        background: rgba(255,255,255,0.012);
        flex-wrap: wrap;
    }
    .saved-minutes-header-title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: 'Playfair Display', serif;
        font-size: 1rem;
        font-weight: 700;
        color: #e8e2d4;
        margin: 0;
    }
    .saved-minutes-header-title i { color: #00e0ff; }
    .saved-minutes-count {
        background: rgba(0,224,255,0.1);
        color: #00e0ff;
        padding: 2px 10px;
        border-radius: 12px;
        font-size: 0.68rem;
        font-weight: 700;
    }
    .btn-print-all {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        background: rgba(0,224,255,0.08);
        border: 1px solid rgba(0,224,255,0.18);
        border-radius: 20px;
        color: #00e0ff;
        font-family: inherit;
        font-size: 0.72rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
    }
    .btn-print-all:hover {
        background: rgba(0,224,255,0.15);
        transform: translateY(-1px);
    }

    .saved-minutes-body { padding: 6px 0; }

    .minute-item {
        padding: 18px 22px;
        border-bottom: 1px solid rgba(255,255,255,0.04);
        transition: background 0.15s;
    }
    .minute-item:hover { background: rgba(255,255,255,0.015); }
    .minute-item:last-child { border-bottom: none; }

    .minute-head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
        flex-wrap: wrap;
    }
    .minute-index {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 26px;
        height: 26px;
        padding: 0 8px;
        border-radius: 8px;
        background: rgba(0,224,255,0.1);
        color: #00e0ff;
        font-size: 0.7rem;
        font-weight: 700;
    }
    .minute-date {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.78rem;
        color: rgba(255,255,255,0.7);
        font-weight: 500;
    }
    .minute-date i { color: rgba(255,255,255,0.3); }
    .minute-time {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.72rem;
        color: rgba(255,255,255,0.35);
    }
    .minute-author {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.68rem;
        color: rgba(255,255,255,0.35);
    }
    .minute-author i { color: rgba(0,224,255,0.5); }

    .minute-content {
        font-family: 'Georgia', serif;
        font-size: 0.88rem;
        line-height: 1.65;
        color: rgba(232,226,212,0.85);
        white-space: pre-wrap;
        word-wrap: break-word;
    }
    .minute-content.collapsed {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .minute-toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 8px;
        padding: 4px 12px;
        background: rgba(0,224,255,0.06);
        border: 1px solid rgba(0,224,255,0.12);
        border-radius: 14px;
        color: #00e0ff;
        font-size: 0.68rem;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        transition: all 0.2s;
    }
    .minute-toggle:hover { background: rgba(0,224,255,0.12); }

    .minute-actions {
        display: flex;
        gap: 8px;
        margin-top: 14px;
        flex-wrap: wrap;
        align-items: center;
    }
    .minute-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px;
        border-radius: 8px;
        font-size: 0.72rem;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.2s;
        border: 1px solid transparent;
    }
    .minute-btn.print  { background: rgba(0,224,255,0.08);  color: #00e0ff; border-color: rgba(0,224,255,0.15); }
    .minute-btn.print:hover  { background: rgba(0,224,255,0.15); }
    .minute-btn.edit   { background: rgba(245,197,66,0.08); color: #f5c542; border-color: rgba(245,197,66,0.15); }
    .minute-btn.edit:hover   { background: rgba(245,197,66,0.15); }
    .minute-btn.delete { background: rgba(255,107,107,0.08); color: #ff6b6b; border-color: rgba(255,107,107,0.15); }
    .minute-btn.delete:hover { background: rgba(255,107,107,0.15); }

    .minute-saved-badge {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 4px 10px;
        background: rgba(74,222,128,0.08);
        border: 1px solid rgba(74,222,128,0.15);
        border-radius: 12px;
        color: #4ade80;
        font-size: 0.62rem;
        font-weight: 600;
        letter-spacing: 0.3px;
        text-transform: uppercase;
    }

    .minutes-empty {
        text-align: center;
        padding: 60px 24px;
        color: rgba(255,255,255,0.25);
    }
    .minutes-empty i {
        font-size: 2.6rem;
        display: block;
        margin-bottom: 14px;
        opacity: 0.3;
        color: #00e0ff;
    }
    .minutes-empty-title {
        font-family: 'Playfair Display', serif;
        font-size: 1rem;
        color: rgba(255,255,255,0.5);
        margin-bottom: 6px;
    }
    .minutes-empty-sub {
        font-size: 0.8rem;
        color: rgba(255,255,255,0.25);
    }

    @media (max-width: 720px) {
        .minutes-page-wrap { padding: 16px; }
        .mp-header { padding: 16px; flex-direction: column; align-items: flex-start; }
        .mp-header-stats { margin-left: 0; }
        .minutes-textarea { padding: 16px 18px; min-height: 200px; }
        .minutes-editor-footer { padding: 12px 16px; }
        .btn-minutes { flex: 1; justify-content: center; }
        .minutes-status { margin-left: 0; width: 100%; justify-content: center; }
    }
</style>

<div class="minutes-page-wrap">

    <!-- Header -->
    <div class="mp-header">
        <div class="mp-header-icon"><i class="fas fa-file-alt"></i></div>
        <div class="mp-header-text">
            <h2>Meeting Minutes</h2>
            <p>Draft, save and archive meeting notes for Karacel SACCO</p>
        </div>
        <div class="mp-header-stats">
            <span class="mp-chip"><i class="fas fa-archive"></i> <span id="minuteCountChip">0</span> saved</span>
            <span class="mp-chip"><i class="fas fa-clock"></i> <span id="lastSavedChip">—</span></span>
        </div>
    </div>

    <!-- Editor -->
    <div class="minutes-editor-card">
        <div class="minutes-editor-head">
            <div class="minutes-editor-head-icon"><i class="fas fa-pen-nib"></i></div>
            <div>
                <div class="minutes-editor-head-title">Draft Minutes</div>
                <div class="minutes-editor-head-sub">Type or paste meeting notes below</div>
            </div>
        </div>

        <textarea
            class="minutes-textarea"
            id="minutesTextarea"
            placeholder="Type meeting minutes here…&#10;Example:&#10;- The meeting was called to order at 10:00 AM.&#10;- Reviewed member savings performance.&#10;- Approved new loan applications."
        ></textarea>

        <div class="minutes-editor-footer">
            <button class="btn-minutes primary" id="saveMinutesBtn">
                <i class="fas fa-check-circle"></i> Save Minutes
            </button>
            <button class="btn-minutes" id="clearMinutesBtn">
                <i class="fas fa-undo-alt"></i> Clear
            </button>
            <button class="btn-minutes" id="demoLoadBtn">
                <i class="fas fa-file-import"></i> Load Sample
            </button>
            <span class="minutes-status" id="saveStatus">
                <i class="fas fa-circle" style="color: #4caf50; font-size: 0.5rem;"></i>
                <span id="statusText">Ready</span>
            </span>
        </div>
    </div>

    <!-- Saved -->
    <div class="saved-minutes-section">
        <div class="saved-minutes-header">
            <h3 class="saved-minutes-header-title">
                <i class="fas fa-archive"></i>
                Saved Minutes
                <span class="saved-minutes-count" id="savedMinutesCount">0</span>
            </h3>
            <button class="btn-print-all" onclick="printAllMinutes()">
                <i class="fas fa-print"></i> Print All
            </button>
        </div>
        <div class="saved-minutes-body" id="minutesListContainer"></div>
    </div>

</div>

<script>
(function() {
    "use strict";

    const textarea = document.getElementById('minutesTextarea');
    const saveBtn = document.getElementById('saveMinutesBtn');
    const clearBtn = document.getElementById('clearMinutesBtn');
    const demoBtn = document.getElementById('demoLoadBtn');
    const statusText = document.getElementById('statusText');
    const statusIcon = document.querySelector('#saveStatus i');
    const listContainer = document.getElementById('minutesListContainer');
    const savedCountEl = document.getElementById('savedMinutesCount');
    const countChipEl = document.getElementById('minuteCountChip');
    const lastSavedChipEl = document.getElementById('lastSavedChip');

    // ---------- SAVE ----------
    window.saveMinutes = function() {
        const content = textarea.value.trim();
        if (!content) { setStatus('Cannot save empty minutes', '#ff6b6b'); return; }

        let saved = JSON.parse(localStorage.getItem('karacel_minutes') || '[]');
        const now = new Date();
        const dateStr = now.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

        saved.unshift({
            id: Date.now(),
            content: content,
            date: dateStr,
            time: timeStr,
            timestamp: now.toISOString()
        });
        if (saved.length > 20) saved = saved.slice(0, 20);
        localStorage.setItem('karacel_minutes', JSON.stringify(saved));

        renderSavedMinutes(saved);
        setStatus('Saved!', '#4ade80');
        textarea.value = '';

        saveBtn.innerHTML = '<i class="fas fa-check-circle"></i> Save Minutes';
        saveBtn.style.background = '';
        saveBtn.onclick = window.saveMinutes;
    };

    // ---------- RENDER ----------
    window.renderSavedMinutes = function(minutesArray) {
        if (!listContainer) return;
        savedCountEl.textContent = minutesArray.length;
        countChipEl.textContent = minutesArray.length;
        lastSavedChipEl.textContent = minutesArray.length > 0 ? minutesArray[0].date : '—';

        if (!minutesArray || minutesArray.length === 0) {
            listContainer.innerHTML = `
                <div class="minutes-empty">
                    <i class="fas fa-inbox"></i>
                    <div class="minutes-empty-title">No saved minutes yet</div>
                    <div class="minutes-empty-sub">Your saved meeting notes will appear here</div>
                </div>`;
            return;
        }

        let html = '';
        minutesArray.forEach((item, idx) => {
            const content = item.content || '';
            const id = item.id;
            const isLong = content.length > 220;

            html += `
                <div class="minute-item">
                    <div class="minute-head">
                        <span class="minute-index">#${minutesArray.length - idx}</span>
                        <span class="minute-date"><i class="far fa-calendar-alt"></i> ${escapeHtml(item.date || '—')}</span>
                        <span class="minute-time"><i class="far fa-clock"></i> ${escapeHtml(item.time || '')}</span>
                        <span class="minute-author"><i class="fas fa-user-circle"></i> Secretary</span>
                    </div>

                    <div class="minute-content ${isLong ? 'collapsed' : ''}" id="content_${id}">${escapeHtml(content)}</div>

                    ${isLong ? `
                        <button class="minute-toggle" id="toggle_${id}" onclick="toggleMinute('${id}')">
                            <i class="fas fa-chevron-down"></i> Read more
                        </button>` : ''}

                    <div class="minute-actions">
                        <button class="minute-btn print" onclick="printMinute('${id}')"><i class="fas fa-print"></i> Print</button>
                        <button class="minute-btn edit" onclick="editMinute('${id}')"><i class="fas fa-edit"></i> Edit</button>
                        <button class="minute-btn delete" onclick="deleteMinute('${id}')"><i class="fas fa-trash"></i> Delete</button>
                        <span class="minute-saved-badge"><i class="fas fa-check-circle"></i> Saved</span>
                    </div>
                </div>`;
        });
        listContainer.innerHTML = html;
    };

    // ---------- TOGGLE ----------
    window.toggleMinute = function(id) {
        const el = document.getElementById(`content_${id}`);
        const btn = document.getElementById(`toggle_${id}`);
        if (!el || !btn) return;
        const collapsed = el.classList.contains('collapsed');
        if (collapsed) {
            el.classList.remove('collapsed');
            btn.innerHTML = '<i class="fas fa-chevron-up"></i> Read less';
        } else {
            el.classList.add('collapsed');
            btn.innerHTML = '<i class="fas fa-chevron-down"></i> Read more';
        }
    };

    // ---------- PRINT ONE ----------
    window.printMinute = function(id) {
        const saved = JSON.parse(localStorage.getItem('karacel_minutes') || '[]');
        const item = saved.find(m => m.id === parseInt(id));
        if (!item) { alert('Minute not found.'); return; }

        const w = window.open('', '_blank', 'width=800,height=600');
        w.document.write(`
            <html><head><title>Meeting Minutes - ${item.date}</title>
            <style>
                body { font-family: 'Georgia', serif; max-width: 800px; margin: 40px auto; padding: 20px; line-height: 1.6; color: #222; }
                .header { border-bottom: 2px solid #333; padding-bottom: 20px; margin-bottom: 24px; text-align: center; }
                .header h1 { margin: 0; font-size: 24px; letter-spacing: 1px; }
                .header .sub { color: #666; font-size: 13px; margin-top: 6px; }
                .content { white-space: pre-wrap; font-size: 14px; padding: 10px 0; }
                .footer { margin-top: 40px; border-top: 1px solid #ddd; padding-top: 20px; font-size: 12px; color: #666; text-align: center; }
                .no-print { text-align: center; margin-top: 30px; }
                .no-print button { padding: 10px 30px; cursor: pointer; margin: 0 4px; }
                @media print { .no-print { display: none; } }
            </style></head><body>
            <div class="header"><h1>📋 MEETING MINUTES</h1><div class="sub">${item.date} at ${item.time} | Prepared by: Secretary</div></div>
            <div class="content">${escapeHtml(item.content)}</div>
            <div class="footer"><p>This is a computer-generated document.</p><p>${item.date} · ${item.time}</p></div>
            <div class="no-print"><button onclick="window.print()">🖨️ Print</button><button onclick="window.close()">Close</button></div>
            </body></html>`);
        w.document.close();
    };

    // ---------- PRINT ALL ----------
    window.printAllMinutes = function() {
        const saved = JSON.parse(localStorage.getItem('karacel_minutes') || '[]');
        if (saved.length === 0) { alert('No minutes to print.'); return; }

        let contentHtml = '';
        saved.forEach((item, index) => {
            contentHtml += `
                <div style="margin-bottom: 40px; ${index > 0 ? 'border-top: 2px dashed #ccc; padding-top: 30px;' : ''}">
                    <div style="border-bottom: 1px solid #ddd; padding-bottom: 10px; margin-bottom: 15px;">
                        <strong style="font-size: 15px;">📋 MINUTES #${saved.length - index}</strong>
                        <span style="color: #666; font-size: 12px; margin-left: 20px;">${item.date} at ${item.time}</span>
                    </div>
                    <div style="white-space: pre-wrap; font-size: 13px; line-height: 1.7;">${escapeHtml(item.content)}</div>
                </div>`;
        });

        const w = window.open('', '_blank', 'width=800,height=600');
        w.document.write(`
            <html><head><title>All Meeting Minutes</title>
            <style>
                body { font-family: 'Georgia', serif; max-width: 800px; margin: 30px auto; padding: 20px; line-height: 1.6; color: #222; }
                .header { text-align: center; border-bottom: 3px solid #333; padding-bottom: 20px; margin-bottom: 30px; }
                .header h1 { margin: 0; }
                .header .sub { color: #666; }
                .no-print { text-align: center; margin-top: 30px; }
                .no-print button { padding: 10px 30px; cursor: pointer; margin: 0 4px; }
                @media print { .no-print { display: none; } }
            </style></head><body>
            <div class="header"><h1>📋 ALL MEETING MINUTES</h1><div class="sub">Total: ${saved.length} entries · Printed: ${new Date().toLocaleString()}</div></div>
            ${contentHtml}
            <div style="text-align:center; color:#666; font-size:12px; margin-top:40px; border-top:1px solid #ddd; padding-top:20px;">
                This is a computer-generated document.
            </div>
            <div class="no-print"><button onclick="window.print()">🖨️ Print All</button><button onclick="window.close()">Close</button></div>
            </body></html>`);
        w.document.close();
    };

    // ---------- EDIT ----------
    window.editMinute = function(id) {
        const saved = JSON.parse(localStorage.getItem('karacel_minutes') || '[]');
        const index = saved.findIndex(m => m.id === parseInt(id));
        if (index === -1) { alert('Minute not found.'); return; }

        const item = saved[index];
        textarea.value = item.content;
        textarea.focus();
        textarea.scrollIntoView({ behavior: 'smooth', block: 'center' });

        saved.splice(index, 1);
        localStorage.setItem('karacel_minutes', JSON.stringify(saved));
        renderSavedMinutes(saved);

        setStatus('Editing ' + item.date, '#00e0ff');
        saveBtn.innerHTML = '<i class="fas fa-pen"></i> Update Minutes';
        saveBtn.style.background = 'linear-gradient(135deg, #f5c542, #eab308)';
        saveBtn.onclick = function() {
            window.saveMinutes();
            saveBtn.innerHTML = '<i class="fas fa-check-circle"></i> Save Minutes';
            saveBtn.style.background = '';
            saveBtn.onclick = window.saveMinutes;
        };
    };

    // ---------- DELETE ----------
    window.deleteMinute = function(id) {
        if (!confirm('Delete this minute? This cannot be undone.')) return;
        let saved = JSON.parse(localStorage.getItem('karacel_minutes') || '[]');
        saved = saved.filter(m => m.id !== parseInt(id));
        localStorage.setItem('karacel_minutes', JSON.stringify(saved));
        renderSavedMinutes(saved);
        setStatus('Deleted', '#ff6b6b');
    };

    // ---------- HELPERS ----------
    function setStatus(msg, color) {
        statusText.textContent = msg;
        if (statusIcon) statusIcon.style.color = color || '#4caf50';
        if (msg !== 'Ready') {
            setTimeout(() => {
                statusText.textContent = 'Ready';
                if (statusIcon) statusIcon.style.color = '#4caf50';
            }, 2500);
        }
    }

    function escapeHtml(text) {
        if (!text) return '';
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return String(text).replace(/[&<>"']/g, m => map[m]);
    }

    function clearTextarea() {
        textarea.value = '';
        textarea.focus();
        setStatus('Cleared', '#f5c542');
        saveBtn.innerHTML = '<i class="fas fa-check-circle"></i> Save Minutes';
        saveBtn.style.background = '';
        saveBtn.onclick = window.saveMinutes;
    }

    function loadSample() {
        textarea.value = `AGENDA – SPECIAL MEETING 21 AUG 2026

1. Call to order – 10:00 AM
2. Reading of previous minutes – approved
3. Treasurer's report – savings grew by 8%
4. Loan committee update – 12 new applications
5. Welfare: support for member family
6. Any other business
7. Adjournment – 12:15 PM

Prepared by: Secretary`;
        setStatus('Sample loaded', '#00e0ff');
    }

    function loadSavedMinutes() {
        const saved = JSON.parse(localStorage.getItem('karacel_minutes') || '[]');
        renderSavedMinutes(saved);
    }

    // ---------- INIT ----------
    saveBtn.addEventListener('click', window.saveMinutes);
    clearBtn.addEventListener('click', clearTextarea);
    demoBtn.addEventListener('click', loadSample);
    loadSavedMinutes();

})();
</script>

{% endblock %}
