<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Karacel SACCO Admin{% endblock %}</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS Files -->
    <link rel="stylesheet" href="{{ url_for('static', filename='admin_dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='admin-users.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <style>
        /* Fix for standalone pages - always show content */
        .standalone-page .content-panel {
            display: block !important;
        }
        
        /* Ensure app bar shows on standalone pages */
        .standalone-page .app-bar {
            display: flex !important;
        }
    </style>
</head>

<body>

<div class="admin-wrapper">

    <!-- ============================================
    SIDEBAR
    ============================================ -->
    <aside class="admin-sidebar">

        <div class="admin-sidebar-logo">
            <h2>
                <i class="fas fa-handshake"></i>
                <span>Karacel</span>
            </h2>
            <p>SACCO Admin</p>
        </div>

        <div class="admin-sidebar-nav">
            <!-- Dashboard -->
            <a href="#" class="admin-nav-item active" data-panel="dashboard">
                <i class="fas fa-tachometer-alt"></i>
                <span>Dashboard</span>
            </a>

            <!-- Members -->
            <a href="#" class="admin-nav-item" data-panel="members">
                <i class="fas fa-users"></i>
                <span>Members</span>
            </a>

            <!-- Loan Applications -->
            <a href="#" class="admin-nav-item" data-panel="loan_applications">
                <i class="fas fa-file-invoice"></i>
                <span>Loan Applications</span>
            </a>

            <!-- Staff Users - FIXED: Now uses panel navigation -->
            <a href="#" class="admin-nav-item" data-panel="users">
                <i class="fas fa-users-cog"></i>
                <span>Staff Users</span>
            </a>

            <!-- Reports -->
            <a href="#" class="admin-nav-item" data-panel="reports">
                <i class="fas fa-chart-bar"></i>
                <span>Reports</span>
            </a>

            <!-- Settings -->
            <a href="#" class="admin-nav-item" data-panel="settings">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </a>
        </div>

        <div class="sidebar-footer">
            <a href="{{ url_for('logout') }}" class="logout-sidebar">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </a>
        </div>

    </aside>

    <!-- ============================================
    MAIN CONTENT
    ============================================ -->
    <main class="admin-main-content">
        {% block content %}
        {% endblock %}
    </main>

</div>

<script>
    // ============================================================
    // PANEL NAVIGATION (Only for dashboard page)
    // ============================================================
    function showPanel(panelName) {
        console.log('Showing panel:', panelName);

        // Hide all panels
        document.querySelectorAll(".content-panel").forEach(panel => {
            panel.classList.remove("active");
        });

        // Show selected panel
        const selectedPanel = document.getElementById(panelName + "-panel");
        if (selectedPanel) {
            selectedPanel.classList.add("active");
            console.log('Panel activated:', panelName + '-panel');
        } else {
            console.warn('Panel not found:', panelName + '-panel');
        }

        // Update nav items
        document.querySelectorAll(".admin-nav-item").forEach(link => {
            link.classList.remove("active");
        });

        // Find and activate the matching nav link
        const selectedLink = document.querySelector(
            `.admin-nav-item[data-panel="${panelName}"]`
        );
        if (selectedLink) {
            selectedLink.classList.add("active");
            console.log('Nav link activated:', panelName);
        }

        // Update app bar title if it exists
        const titleElement = document.getElementById('appBarTitle');
        const subtitleElement = document.getElementById('appBarSubtitle');
        
        const titles = {
            dashboard: { icon: 'fa-tachometer-alt', title: 'Dashboard', subtitle: 'Karacel SACCO Administration Panel' },
            members: { icon: 'fa-users', title: 'Members', subtitle: 'View all SACCO member records' },
            loan_applications: { icon: 'fa-file-invoice', title: 'Loan Applications', subtitle: 'Review and process loan requests' },
            reports: { icon: 'fa-chart-bar', title: 'Reports', subtitle: 'Generate and download reports' },
            settings: { icon: 'fa-cog', title: 'Settings', subtitle: 'System configuration and preferences' },
            users: { icon: 'fa-users-cog', title: 'Staff Users', subtitle: 'Manage staff user accounts' }
        };

        const info = titles[panelName];
        if (info && titleElement) {
            titleElement.innerHTML = `<i class="fas ${info.icon}"></i> ${info.title}`;
        }
        if (info && subtitleElement) {
            subtitleElement.textContent = info.subtitle;
        }
    }

    // ============================================================
    // INITIALIZE
    // ============================================================
    document.addEventListener("DOMContentLoaded", function () {
        // Check if we're on the dashboard page (has panels)
        const hasPanels = document.querySelector('.content-panel');
        
        if (hasPanels) {
            // Handle nav item clicks for dashboard
            document.querySelectorAll(".admin-nav-item").forEach(link => {
                link.addEventListener("click", function (e) {
                    const panelName = this.getAttribute("data-panel");
                    if (panelName) {
                        e.preventDefault();
                        showPanel(panelName);
                        // Update URL hash
                        window.location.hash = panelName;
                    }
                });
            });

            // Check URL hash on load
            const currentHash = window.location.hash.replace("#", "") || "dashboard";
            showPanel(currentHash);
            console.log('Admin dashboard initialized with panel:', currentHash);
        }

        // Handle browser back/forward
        window.addEventListener("hashchange", function() {
            const panelName = window.location.hash.replace("#", "") || "dashboard";
            if (document.querySelector('.content-panel')) {
                showPanel(panelName);
            }
        });
    });

    // ============================================================
    // DELETE USER FUNCTIONS (Keep these in base template)
    // ============================================================
    function closeDeleteUserModal() {
        const modal = document.getElementById('deleteUserModal');
        if (modal) modal.style.display = 'none';
        const userIdInput = document.getElementById('deleteUserId');
        if (userIdInput) userIdInput.value = '';
    }

    function confirmDeleteUser() {
        const userId = document.getElementById('deleteUserId').value;
        
        if (!userId) {
            alert('Error: User ID is missing.');
            return;
        }
        
        if (!confirm('⚠️ Are you absolutely sure you want to permanently delete this user?\n\nThis action cannot be undone!')) {
            return;
        }
        
        const btn = document.querySelector('#deleteUserModal button:last-child');
        if (!btn) return;
        
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Deleting...';
        btn.disabled = true;
        
        fetch('/admin/users/delete/' + userId, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json',
                'X-Requested-With': 'XMLHttpRequest'
            },
            body: JSON.stringify({ 
                _method: 'DELETE',
                user_id: userId 
            })
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('HTTP error! Status: ' + response.status);
            }
            return response.json();
        })
        .then(data => {
            if (data.success) {
                alert('✅ ' + data.message);
                closeDeleteUserModal();
                location.reload();
            } else {
                alert('❌ Error: ' + (data.message || 'Could not delete user'));
            }
        })
        .catch(error => {
            console.error('❌ Error:', error);
            alert('❌ Error: ' + error.message);
        })
        .finally(() => {
            btn.innerHTML = originalText;
            btn.disabled = false;
        });
    }

    // ============================================================
    // RESET PASSWORD FUNCTION
    // ============================================================
    function resetUserPassword(userId, userName) {
        if (!userId) {
            alert('Error: User ID is missing.');
            return;
        }
        
        document.getElementById('resetPasswordMessage').textContent = 
            'Are you sure you want to reset the password for "' + userName + '"?';
        document.getElementById('resetUserId').value = userId;
        document.getElementById('resetPasswordModal').style.display = 'flex';
    }

    function closeResetPasswordModal() {
        document.getElementById('resetPasswordModal').style.display = 'none';
        document.getElementById('resetUserId').value = '';
    }

    function confirmResetPassword() {
        const userId = document.getElementById('resetUserId').value;
        if (!userId) {
            alert('Error: User ID is missing.');
            return;
        }
        const btn = document.querySelector('#resetPasswordModal button:last-child');
        if (!btn) return;
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resetting...';
        btn.disabled = true;
        fetch('/admin/users/reset-password/' + userId, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }
        })
        .then(response => {
            if (!response.ok) throw new Error('HTTP error! Status: ' + response.status);
            return response.json();
        })
        .then(data => {
            if (data.success) {
                alert('✅ Password reset successfully!\n\nNew Password: ' + data.new_password);
                closeResetPasswordModal();
            } else {
                alert('❌ Error: ' + (data.message || 'Could not reset password'));
            }
        })
        .catch(error => {
            console.error('❌ Error:', error);
            alert('❌ Error: ' + error.message);
        })
        .finally(() => {
            btn.innerHTML = originalText;
            btn.disabled = false;
        });
    }

    // ============================================================
    // EDIT USER FUNCTIONS
    // ============================================================
    function openEditUserModal(userId) {
        if (!userId) {
            alert('Error: User ID is missing.');
            return;
        }
        
        console.log('📝 Editing user:', userId);
        const modal = document.getElementById('editUserModal');
        if (!modal) {
            alert('Error: Edit modal not found.');
            return;
        }
        modal.style.display = 'flex';
        document.getElementById('editUserId').value = userId;
        const submitBtn = document.getElementById('editUserSubmitBtn');
        if (submitBtn) {
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading...';
            submitBtn.disabled = true;
        }
        fetch('/admin/users/view/' + userId)
            .then(response => {
                if (!response.ok) throw new Error('HTTP error! Status: ' + response.status);
                return response.json();
            })
            .then(data => {
                if (data.success) {
                    const user = data.user;
                    document.getElementById('editUserFullName').value = user.full_name || '';
                    document.getElementById('editUserEmail').value = user.email || '';
                    document.getElementById('editUserPhone').value = user.phone || '';
                    document.getElementById('editUserRole').value = user.role || '';
                    document.getElementById('editUserStatus').value = user.status || 'active';
                } else {
                    alert('❌ Error: ' + (data.message || 'Could not load user data'));
                    closeEditUserModal();
                }
            })
            .catch(error => {
                console.error('❌ Error:', error);
                alert('❌ Error loading user data: ' + error.message);
                closeEditUserModal();
            })
            .finally(() => {
                if (submitBtn) {
                    submitBtn.innerHTML = '<i class="fas fa-save"></i> Save Changes';
                    submitBtn.disabled = false;
                }
            });
    }

    function closeEditUserModal() {
        const modal = document.getElementById('editUserModal');
        if (modal) modal.style.display = 'none';
        const form = document.getElementById('editUserForm');
        if (form) form.reset();
    }

    function submitEditUser(event) {
        event.preventDefault();
        const form = document.getElementById('editUserForm');
        const formData = new FormData(form);
        const userId = document.getElementById('editUserId').value;
        const fullName = formData.get('full_name').trim();
        const email = formData.get('email').trim();
        const phone = formData.get('phone').trim();
        const role = formData.get('role');
        const status = formData.get('status');
        if (!fullName || !email) {
            alert('Full name and email are required.');
            return;
        }
        if (!isValidEmail(email)) {
            alert('Please enter a valid email address.');
            return;
        }
        const submitBtn = document.getElementById('editUserSubmitBtn');
        const originalText = submitBtn.innerHTML;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
        submitBtn.disabled = true;
        const data = { full_name: fullName, email: email, phone: phone || '', role: role, status: status };
        fetch('/admin/users/update/' + userId, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(response => {
            if (!response.ok) throw new Error('HTTP error! Status: ' + response.status);
            return response.json();
        })
        .then(result => {
            if (result.success) {
                alert('✅ ' + result.message);
                closeEditUserModal();
                location.reload();
            } else {
                alert('❌ Error: ' + (result.message || 'Could not update user'));
            }
        })
        .catch(error => {
            console.error('❌ Error:', error);
            alert('❌ Error: ' + error.message);
        })
        .finally(() => {
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
        });
    }

    function isValidEmail(email) {
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return re.test(email);
    }

    // ============================================================
    // DELETE USER FUNCTION (called from dashboard)
    // ============================================================
    function deleteUser(userId, userName) {
        if (!userId) {
            alert('Error: User ID is missing.');
            return;
        }
        document.getElementById('deleteUserMessage').textContent = 
            '⚠️ Are you sure you want to delete user "' + userName + '"? This action cannot be undone.';
        document.getElementById('deleteUserId').value = userId;
        document.getElementById('deleteUserModal').style.display = 'flex';
    }

    // ============================================================
    // CLOSE MODALS ON ESCAPE AND OUTSIDE CLICK
    // ============================================================
    document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
            closeEditUserModal();
            closeResetPasswordModal();
            closeDeleteUserModal();
        }
    });

    document.addEventListener('click', function(event) {
        const editModal = document.getElementById('editUserModal');
        if (editModal && event.target === editModal) closeEditUserModal();
        const resetModal = document.getElementById('resetPasswordModal');
        if (resetModal && event.target === resetModal) closeResetPasswordModal();
        const deleteModal = document.getElementById('deleteUserModal');
        if (deleteModal && event.target === deleteModal) closeDeleteUserModal();
    });

    console.log('✅ Admin base template loaded successfully');
</script>

</body>
</html>
