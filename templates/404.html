<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Karacel Association</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a0e1a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Animated Gradient Background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(245, 197, 66, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(0, 224, 255, 0.06) 0%, transparent 60%),
                linear-gradient(135deg, #050c19 0%, #0d1b2a 50%, #1b263b 100%);
            z-index: 0;
        }

        /* Floating Particles */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(245, 197, 66, 0.3);
            border-radius: 50%;
            animation: floatParticle 15s infinite linear;
        }

        .particle:nth-child(1) { left: 10%; top: 20%; animation-delay: 0s; width: 6px; height: 6px; }
        .particle:nth-child(2) { left: 85%; top: 60%; animation-delay: 3s; }
        .particle:nth-child(3) { left: 25%; top: 75%; animation-delay: 6s; width: 8px; height: 8px; background: rgba(0, 224, 255, 0.2); }
        .particle:nth-child(4) { left: 70%; top: 15%; animation-delay: 2s; }
        .particle:nth-child(5) { left: 45%; top: 90%; animation-delay: 4s; width: 5px; height: 5px; }
        .particle:nth-child(6) { left: 5%; top: 45%; animation-delay: 7s; width: 7px; height: 7px; background: rgba(245, 197, 66, 0.2); }
        .particle:nth-child(7) { left: 92%; top: 85%; animation-delay: 5s; }
        .particle:nth-child(8) { left: 50%; top: 10%; animation-delay: 8s; width: 5px; height: 5px; background: rgba(0, 224, 255, 0.2); }
        .particle:nth-child(9) { left: 15%; top: 50%; animation-delay: 9s; width: 4px; height: 4px; }
        .particle:nth-child(10) { left: 75%; top: 30%; animation-delay: 11s; width: 6px; height: 6px; }

        @keyframes floatParticle {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.3; }
            50% { transform: translateY(-120px) rotate(180deg); opacity: 0.8; }
            100% { transform: translateY(0) rotate(360deg); opacity: 0.3; }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 40px;
            max-width: 600px;
            width: 90%;
        }

        /* Glowing border card */
        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 50px 45px 45px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 
                0 25px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            position: relative;
            animation: fadeInUp 0.8s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Decorative glow ring */
        .card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 34px;
            background: linear-gradient(135deg, rgba(245, 197, 66, 0.2), transparent 40%, transparent 60%, rgba(0, 224, 255, 0.2));
            z-index: -1;
            opacity: 0.5;
        }

        /* 404 Number */
        .error-code {
            font-family: 'Playfair Display', serif;
            font-size: 100px;
            font-weight: 700;
            background: linear-gradient(135deg, #f5c542, #d4a020, #f5c542);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmerText 3s ease-in-out infinite;
            line-height: 1;
            margin-bottom: 10px;
            position: relative;
        }

        @keyframes shimmerText {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Floating 404 glow */
        .error-code::after {
            content: '404';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            font-size: 100px;
            font-weight: 700;
            color: transparent;
            text-shadow: 0 0 80px rgba(245, 197, 66, 0.15);
            z-index: -1;
            opacity: 0.5;
            animation: glowPulse 3s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.3; transform: translateX(-50%) scale(1); }
            50% { opacity: 0.7; transform: translateX(-50%) scale(1.05); }
        }

        .error-icon {
            font-size: 60px;
            color: rgba(245, 197, 66, 0.2);
            margin-bottom: 16px;
            display: block;
            animation: floatIcon 4s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(-5deg); }
        }

        .title {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.4);
            font-size: 16px;
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 30px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(245, 197, 66, 0.3), transparent);
            margin: 0 auto 30px;
            border-radius: 2px;
        }

        .button-group {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            background: linear-gradient(135deg, rgba(245, 197, 66, 0.2), rgba(245, 197, 66, 0.05));
            border: 1px solid rgba(245, 197, 66, 0.25);
            border-radius: 16px;
            color: #f5c542;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.5px;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, rgba(245, 197, 66, 0.3), rgba(245, 197, 66, 0.1));
            border-color: rgba(245, 197, 66, 0.5);
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(245, 197, 66, 0.1);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-3px);
            color: rgba(255, 255, 255, 0.8);
        }

        .btn-primary i,
        .btn-secondary i {
            font-size: 0.9rem;
        }

        /* Suggested Links */
        .suggested-links {
            margin-top: 32px;
            padding-top: 28px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .suggested-links p {
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 14px;
        }

        .suggested-links a {
            color: rgba(255, 255, 255, 0.25);
            text-decoration: none;
            font-size: 0.85rem;
            margin: 0 14px;
            transition: color 0.3s;
        }

        .suggested-links a:hover {
            color: #f5c542;
        }

        .suggested-links span {
            color: rgba(255, 255, 255, 0.06);
        }

        /* Responsive */
        @media (max-width: 640px) {
            .card {
                padding: 35px 25px 30px;
                border-radius: 24px;
            }

            .error-code {
                font-size: 72px;
            }

            .error-code::after {
                font-size: 72px;
            }

            .error-icon {
                font-size: 44px;
            }

            .title {
                font-size: 26px;
            }

            .subtitle {
                font-size: 14px;
            }

            .button-group {
                flex-direction: column;
                align-items: center;
            }

            .btn-primary,
            .btn-secondary {
                width: 100%;
                justify-content: center;
                padding: 12px 24px;
            }

            .suggested-links a {
                display: inline-block;
                margin: 4px 10px;
                font-size: 0.8rem;
            }
        }

        @media (max-width: 400px) {
            .card {
                padding: 28px 18px 24px;
            }

            .error-code {
                font-size: 56px;
            }

            .error-code::after {
                font-size: 56px;
            }

            .title {
                font-size: 22px;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            display: none;
        }

        /* Small decorative elements */
        .deco-line {
            display: inline-block;
            width: 30px;
            height: 1px;
            background: rgba(245, 197, 66, 0.15);
            margin: 0 12px;
            vertical-align: middle;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 14px;
            background: rgba(245, 197, 66, 0.05);
            border: 1px solid rgba(245, 197, 66, 0.08);
            border-radius: 40px;
            font-size: 0.65rem;
            color: rgba(245, 197, 66, 0.3);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- Floating particles background -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="container">
        <div class="card">

            <!-- Status Badge -->
            <div class="status-badge">
                <i class="fas fa-exclamation-triangle" style="margin-right:6px;"></i> Error 404
            </div>

            <!-- 404 Icon -->
            <i class="fas fa-compass error-icon"></i>

            <!-- 404 Number -->
            <div class="error-code">404</div>

            <!-- Title -->
            <h1 class="title">Page Not Found</h1>

            <!-- Divider -->
            <div class="divider"></div>

            <!-- Subtitle -->
            <p class="subtitle">
                Oops! The page you are looking for seems to have wandered off into the digital wilderness.
            </p>

            <!-- Button Group -->
            <div class="button-group">
                <a href="/" class="btn-primary">
                    <i class="fas fa-home"></i> Go Back Home
                </a>
                <a href="javascript:history.back()" class="btn-secondary">
                    <i class="fas fa-arrow-left"></i> Go Back
                </a>
            </div>

            <!-- Suggested Links -->
            <div class="suggested-links">
                <p>You might want to try these</p>
                <a href="/">Home</a>
                <span>|</span>
                <a href="/login">Member Login</a>
                <span>|</span>
                <a href="/register">Register</a>
                <span>|</span>
                <a href="/about">About Us</a>
                <span>|</span>
                <a href="/contact">Contact</a>
            </div>

        </div>
    </div>

    <script>
        // Optional: Add a small easter egg or animation enhancement
        document.addEventListener('DOMContentLoaded', function() {
            // Tiny sparkle effect on the 404 number
            const errorCode = document.querySelector('.error-code');
            if (errorCode) {
                errorCode.addEventListener('mouseenter', function() {
                    this.style.transform = 'scale(1.05)';
                    this.style.transition = 'transform 0.3s ease';
                });
                errorCode.addEventListener('mouseleave', function() {
                    this.style.transform = 'scale(1)';
                });
            }
        });
    </script>

</body>
</html>
