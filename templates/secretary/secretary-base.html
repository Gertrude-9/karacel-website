<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Secretary Dashboard{% endblock %} | Karacel SACCO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a14;
            color: #fff;
            min-height: 100vh;
            display: flex;
        }
        
        .secretary-sidebar {
            width: 250px;
            min-height: 100vh;
            background: linear-gradient(180deg, #0f0f1f, #0a0a14);
            border-right: 1px solid rgba(255,255,255,0.04);
            padding: 20px 0;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            flex-shrink: 0;
        }
        
        .sidebar-brand {
            padding: 0 20px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            margin-bottom: 20px;
        }
        
        .sidebar-brand h2 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #f5c542;
        }
        
        .sidebar-brand h2 i {
            color: #00e0ff;
            margin-right: 8px;
        }
        
        .sidebar-brand span {
            display: block;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.25);
            margin-top: 2px;
        }
        
        .secretary-nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 20px;
            color: rgba(255,255,255,0.4);
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border-left: 3px solid transparent;
            font-size: 0.85rem;
        }
        
        .secretary-nav-item:hover {
            color: rgba(255,255,255,0.8);
            background: rgba(255,255,255,0.02);
        }
        
        .secretary-nav-item.active {
            color: #00e0ff;
            background: rgba(0,224,255,0.05);
            border-left-color: #00e0ff;
        }
        
        .secretary-nav-item i {
            width: 20px;
            text-align: center;
            font-size: 1rem;
        }
        
        .secretary-main-content {
            flex: 1;
            padding: 20px 30px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }
        
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.02);
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.2);
        }
        
        @media (max-width: 768px) {
            .secretary-sidebar {
                width: 200px;
            }
            
            .secretary-main-content {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <nav class="secretary-sidebar">
        <div class="sidebar-brand">
            <h2><i class="fas fa-clipboard-list"></i> Karacel</h2>
            <span>Secretary Portal</span>
        </div>
        
        <!-- All links to treasurer routes -->
        <a class="secretary-nav-item active" href="/treasurer/dashboard">
            <i class="fas fa-chart-pie"></i> Dashboard
        </a>
        <a class="secretary-nav-item" href="/treasurer/members/add">
            <i class="fas fa-users"></i> Members
        </a>
        <a class="secretary-nav-item" href="/treasurer/savings/deposit">
            <i class="fas fa-piggy-bank"></i> Savings
        </a>
        <a class="secretary-nav-item" href="/treasurer/repayment/enter">
            <i class="fas fa-hand-holding-usd"></i> Repayments
        </a>
        <a class="secretary-nav-item" href="/treasurer/loan/pay">
            <i class="fas fa-file-invoice"></i> Loans
        </a>
        <a class="secretary-nav-item" href="/treasurer/guarantor/details">
            <i class="fas fa-handshake"></i> Guarantors
        </a>
        
        <div style="margin-top: auto; padding: 20px; border-top: 1px solid rgba(255,255,255,0.04);">
            <a href="/logout" class="secretary-nav-item" style="color: #ff6b6b;">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </div>
    </nav>
    
    <div class="secretary-main-content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
