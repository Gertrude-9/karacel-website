<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Secretary Dashboard{% endblock %} | Karacel SACCO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='secretary.css') }}">
</head>
<body>
    <nav class="secretary-sidebar">
        <div class="sidebar-brand">
            <h2><i class="fas fa-clipboard-list"></i> Karacel</h2>
            <span>Secretary Portal</span>
        </div>

        <a class="secretary-nav-item" href="/treasurer/dashboard">
            <i class="fas fa-chart-pie"></i> Dashboard
        </a>
        <a class="secretary-nav-item active" href="#" style="border-left-color: #f5c542; color: #f5c542;">
            <i class="fas fa-pen-fancy"></i> Minutes
        </a>
        
        <!-- Staff Member Portal -->
        <li class="nav-item staff-member-portal-item">
            <a href="{{ url_for('member_dashboard', staff_view=True) }}" class="nav-link staff-member-portal-link">
                <span class="nav-icon-wrapper">
                    <i class="fas fa-user-circle"></i>
                    <span class="icon-pulse"></span>
                </span>
                <span class="nav-text">My Member Portal</span>
                <span class="badge staff-badge">
                    <i class="fas fa-star"></i> Staff
                </span>
                <span class="nav-arrow">
                    <i class="fas fa-chevron-right"></i>
                </span>
            </a>
        </li>

        <div class="sidebar-footer">
            <a href="/logout" class="secretary-nav-item" style="color: #ff6b6b;">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </div>
    </nav>

    <div class="secretary-main-content">
        {% block content %}
        <!-- Minutes Section -->
        <div class="minutes-card">
            <h3><i class="fas fa-pen-fancy"></i> Meeting Minutes</h3>
            <textarea id="minutesTextarea" class="minutes-textarea" placeholder="Write meeting minutes here..."></textarea>
            <div class="minutes-actions">
                <button id="saveMinutesBtn" class="btn-minutes primary" onclick="saveMinutes()">
                    <i class="fas fa-check-circle"></i> Save minutes
                </button>
                <button class="btn-minutes" onclick="window.printAllMinutes()">
                    <i class="fas fa-print"></i> Print all
                </button>
                <div class="minutes-status">
                    <i class="fas fa-circle" style="color: #4caf50; font-size: 0.5rem;"></i> Auto-saved
                </div>
            </div>
        </div>

        <!-- Chat Section -->
        <div class="chat-container">
            <h3><i class="fas fa-comments"></i> Member Chat</h3>
            <div class="chat-layout">
                <!-- Member List -->
                <div class="member-list" id="memberList">
                    <h4><i class="fas fa-users"></i> Members</h4>
                    <div id="memberListContainer">
                        <div style="text-align: center; padding: 20px; color: rgba(255,255,255,0.3);">
                            <i class="fas fa-spinner fa-spin"></i> Loading members...
                        </div>
                    </div>
                </div>

                <!-- Chat Area -->
                <div class="chat-area" id="chatArea">
                    <div class="chat-header">
                        <div>
                            <span class="chat-with" id="chatWith">Select a member</span>
                            <span class="chat-role" id="chatRole"></span>
                        </div>
                        <div id="memberStatus">
                            <span style="font-size: 0.7rem; color: rgba(255,255,255,0.2);">
                                <i class="fas fa-circle" style="color: #666;"></i> Offline
                            </span>
                        </div>
                    </div>
                    <div class="chat-messages-area" id="chatMessages">
                        <div class="no-member-selected">
                            <i class="fas fa-comment-dots"></i>
                            <p>Select a member to start chatting</p>
                        </div>
                    </div>
                    <div class="chat-input-area">
                        <select id="chatType">
                            <option value="general">General</option>
                            <option value="loan">Loan Inquiry</option>
                            <option value="savings">Savings Inquiry</option>
                            <option value="complaint">Complaint</option>
                            <option value="suggestion">Suggestion</option>
                        </select>
                        <input type="text" id="chatInput" placeholder="Type your message..." disabled>
                        <button id="sendChatBtn" onclick="sendMessage()" disabled>
                            <i class="fas fa-paper-plane"></i> Send
                        </button>
                    </div>
                </div>
            </div>
        </div>
        {% endblock %}
    </div>

    <script>
        // ============================================================
        // CHAT SYSTEM - INTEGRATED WITH DATABASE
        // ============================================================
        
        let currentMemberId = null;
        let chatMembers = [];
        let messagePollingInterval = null;
        let isInitialLoad = true;

        // Load members from database on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadMembers();
            setupChatInputListeners();
            
            // Refresh chat messages every 5 seconds
            setInterval(function() {
                if (currentMemberId) {
                    loadMessages(currentMemberId);
                }
            }, 5000);
        });

        // ============================================================
        // LOAD MEMBERS FROM DATABASE
        // ============================================================
        function loadMembers() {
            fetch('/api/members/list')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        chatMembers = data.members;
                        renderMemberList(chatMembers);
                    } else {
                        showMemberListError('Failed to load members');
                    }
                })
                .catch(error => {
                    console.error('Error loading members:', error);
                    showMemberListError('Error loading members. Please refresh.');
                });
        }

        function renderMemberList(members) {
            const container = document.getElementById('memberListContainer');
            
            if (!members || members.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 20px; color: rgba(255,255,255,0.3);">
                        <i class="fas fa-users" style="font-size: 2rem; display: block; margin-bottom: 8px; opacity: 0.15;"></i>
                        No members found
                    </div>
                `;
                return;
            }

            let html = '';
            members.forEach(member => {
                const initials = member.full_name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
                const isActive = member.status === 'active';
                const hasUnread = member.unread_count > 0;
                
                html += `
                    <div class="member-item ${currentMemberId === member.id ? 'active' : ''}" 
                         onclick="selectMember(${member.id})"
                         data-member-id="${member.id}">
                        <div class="avatar" style="background: ${getRandomColor(member.id)};">
                            ${initials}
                        </div>
                        <div class="info">
                            <div class="name">${member.full_name}</div>
                            <div class="status">
                                ${isActive ? '<i class="fas fa-circle" style="color: #4ade80; font-size: 0.4rem;"></i> Active' : '<i class="fas fa-circle" style="color: #666; font-size: 0.4rem;"></i> Inactive'}
                                • ${member.sacco_number}
                            </div>
                        </div>
                        ${hasUnread ? `<span class="member-unread">${member.unread_count}</span>` : ''}
                        <span class="online-indicator ${isActive ? '' : 'offline'}"></span>
                    </div>
                `;
            });
            
            container.innerHTML = html;
            isInitialLoad = false;
        }

        function showMemberListError(message) {
            const container = document.getElementById('memberListContainer');
            container.innerHTML = `
                <div style="text-align: center; padding: 20px; color: rgba(255,107,107,0.5);">
                    <i class="fas fa-exclamation-circle" style="font-size: 2rem; display: block; margin-bottom: 8px;"></i>
                    ${message}
                </div>
            `;
        }

        function getRandomColor(id) {
            const colors = ['#f5c542', '#00e0ff', '#4ade80', '#a78bfa', '#ff6b6b', '#f472b6', '#34d399', '#60a5fa'];
            return colors[id % colors.length];
        }

        // ============================================================
        // SELECT MEMBER AND LOAD CHAT
        // ============================================================
        function selectMember(memberId) {
            currentMemberId = memberId;
            
            // Update active state
            document.querySelectorAll('.member-item').forEach(item => {
                item.classList.remove('active');
                if (parseInt(item.dataset.memberId) === memberId) {
                    item.classList.add('active');
                }
            });
            
            // Find member details
            const member = chatMembers.find(m => m.id === memberId);
            if (member) {
                document.getElementById('chatWith').textContent = member.full_name;
                document.getElementById('chatRole').textContent = `SACCO: ${member.sacco_number}`;
                document.getElementById('memberStatus').innerHTML = `
                    <span style="font-size: 0.7rem; color: ${member.status === 'active' ? '#4ade80' : 'rgba(255,255,255,0.2)'};">
                        <i class="fas fa-circle" style="color: ${member.status === 'active' ? '#4ade80' : '#666'};"></i> 
                        ${member.status === 'active' ? 'Online' : 'Offline'}
                    </span>
                `;
            }
            
            // Enable chat input
            document.getElementById('chatInput').disabled = false;
            document.getElementById('sendChatBtn').disabled = false;
            document.getElementById('chatInput').placeholder = 'Type your message...';
            document.getElementById('chatInput').focus();
            
            // Load messages
            loadMessages(memberId);
            
            // Mark messages as read
            markMessagesAsRead(memberId);
        }

        // ============================================================
        // LOAD MESSAGES FROM DATABASE
        // ============================================================
        function loadMessages(memberId) {
            if (!memberId) return;
            
            fetch(`/api/chat/messages/${memberId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        renderMessages(data.messages);
                        scrollToBottom();
                        
                        // Update unread count in member list
                        if (data.unread_count !== undefined) {
                            updateUnreadCount(memberId, data.unread_count);
                        }
                    }
                })
                .catch(error => {
                    console.error('Error loading messages:', error);
                });
        }

        function renderMessages(messages) {
            const container = document.getElementById('chatMessages');
            
            if (!messages || messages.length === 0) {
                container.innerHTML = `
                    <div class="no-member-selected">
                        <i class="fas fa-comment-dots" style="font-size: 2rem;"></i>
                        <p>No messages yet. Start a conversation!</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            let lastDate = '';
            
            messages.forEach(msg => {
                const msgDate = new Date(msg.created_at).toLocaleDateString();
                const msgTime = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                // Add date separator if new day
                if (msgDate !== lastDate) {
                    html += `
                        <div style="text-align: center; padding: 8px 0; color: rgba(255,255,255,0.15); font-size: 0.65rem;">
                            ${msgDate}
                        </div>
                    `;
                    lastDate = msgDate;
                }
                
                const isOfficial = msg.sender_role === 'admin' || msg.sender_role === 'secretary' || msg.sender_role === 'treasurer';
                const senderName = isOfficial ? 'Karacel Official' : msg.sender_name;
                
                html += `
                    <div class="chat-message ${isOfficial ? 'official' : 'member'}">
                        <div class="sender">
                            <i class="fas ${isOfficial ? 'fa-user-tie' : 'fa-user'}"></i>
                            ${senderName}
                            ${msg.sender_role === 'secretary' ? ' (Secretary)' : ''}
                            ${msg.sender_role === 'admin' ? ' (Admin)' : ''}
                            ${msg.sender_role === 'treasurer' ? ' (Treasurer)' : ''}
                        </div>
                        <div class="text">${escapeHtml(msg.message)}</div>
                        <div class="time">${msgTime}</div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        function scrollToBottom() {
            const container = document.getElementById('chatMessages');
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateUnreadCount(memberId, count) {
            const items = document.querySelectorAll('.member-item');
            items.forEach(item => {
                if (parseInt(item.dataset.memberId) === memberId) {
                    const existingBadge = item.querySelector('.member-unread');
                    if (existingBadge) {
                        existingBadge.remove();
                    }
                    if (count > 0) {
                        const badge = document.createElement('span');
                        badge.className = 'member-unread';
                        badge.textContent = count;
                        item.appendChild(badge);
                    }
                }
            });
        }

        // ============================================================
        // SEND MESSAGE
        // ============================================================
        function sendMessage() {
            if (!currentMemberId) {
                alert('Please select a member first.');
                return;
            }
            
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            const chatType = document.getElementById('chatType').value;
            
            if (!message) {
                input.focus();
                return;
            }
            
            // Disable send button temporarily
            const sendBtn = document.getElementById('sendChatBtn');
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
            
            fetch('/api/chat/send', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    member_id: currentMemberId,
                    message: message,
                    type: chatType
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    input.value = '';
                    loadMessages(currentMemberId);
                } else {
                    alert('Failed to send message: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error sending message:', error);
                alert('Error sending message. Please try again.');
            })
            .finally(() => {
                sendBtn.disabled = false;
                sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Send';
                input.focus();
            });
        }

        // ============================================================
        // MARK MESSAGES AS READ
        // ============================================================
        function markMessagesAsRead(memberId) {
            if (!memberId) return;
            
            fetch('/api/chat/mark-read', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ member_id: memberId })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // Update unread count in member list
                    updateUnreadCount(memberId, 0);
                }
            })
            .catch(error => {
                console.error('Error marking messages as read:', error);
            });
        }

        // ============================================================
        // CHAT INPUT LISTENERS
        // ============================================================
        function setupChatInputListeners() {
            const input = document.getElementById('chatInput');
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            
            // Auto-resize textarea/input
            input.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 100) + 'px';
            });
        }

        // ============================================================
        // MINUTES FUNCTIONS (Existing)
        // ============================================================
        function saveMinutes() {
            const textarea = document.getElementById('minutesTextarea');
            const content = textarea.value.trim();
            
            if (!content) {
                alert('Please write some minutes before saving.');
                return;
            }
            
            const minutes = JSON.parse(localStorage.getItem('karacel_minutes') || '[]');
            const now = new Date();
            const dateStr = now.toLocaleDateString();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            // Check if updating existing (detect if update button is showing)
            const saveBtn = document.getElementById('saveMinutesBtn');
            if (saveBtn.innerHTML.includes('Update')) {
                // Update mode - handled by the edit function
                alert('Use the edit function to update minutes.');
                return;
            }
            
            const newMinutes = {
                id: Date.now(),
                content: content,
                date: dateStr,
                time: timeStr,
                savedAt: now.toISOString()
            };
            
            minutes.unshift(newMinutes);
            localStorage.setItem('karacel_minutes', JSON.stringify(minutes));
            
            textarea.value = '';
            renderSavedMinutes(minutes);
            
            // Reset save button
            saveBtn.innerHTML = '<i class="fas fa-check-circle"></i> Save minutes';
            saveBtn.style.background = '#00e0ff';
            saveBtn.onclick = saveMinutes;
            
            alert('✅ Minutes saved successfully!');
        }

        function renderSavedMinutes(minutes) {
            // This function should be implemented to display saved minutes
            console.log('Rendering saved minutes:', minutes);
        }

        // ============================================================
        // KEYBOARD SHORTCUTS
        // ============================================================
        document.addEventListener('keydown', function(e) {
            // Ctrl+Enter to send message
            if (e.ctrlKey && e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
            
            // Escape to clear selection
            if (e.key === 'Escape' && document.activeElement === document.getElementById('chatInput')) {
                document.getElementById('chatInput').blur();
            }
        });

        // ============================================================
        // NOTIFICATION SOUND (Optional)
        // ============================================================
        function playNotificationSound() {
            try {
                const audio = new Audio('/static/notification.mp3');
                audio.play().catch(() => {});
            } catch (e) {
                // Silently fail if audio not available
            }
        }

        console.log('✅ Chat system initialized successfully');
        console.log('💬 Select a member from the list to start chatting');
    </script>
</body>
</html>
