<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Secretary Dashboard{% endblock %} | Karacel SACCO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='secretary.css') }}">

    <style>
        :root {
            --gold: #c9a961;
            --gold-light: #e0bf75;
            --bg-deep: #0a1420;
            --bg-panel: #0e1c2c;
            --bg-card: rgba(255, 255, 255, 0.025);
            --border-soft: rgba(255, 255, 255, 0.06);
            --border-med: rgba(255, 255, 255, 0.09);
            --text-strong: rgba(255, 255, 255, 0.95);
            --text-soft: rgba(255, 255, 255, 0.55);
            --text-faint: rgba(255, 255, 255, 0.3);
            --sidebar-width: 260px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-deep);
            color: var(--text-strong);
            min-height: 100vh;
            display: flex;
        }

        /* ==================== SIDEBAR (FIXED) ==================== */
        .secretary-sidebar {
            width: var(--sidebar-width);
            background: var(--bg-panel);
            border-right: 1px solid var(--border-soft);
            display: flex;
            flex-direction: column;
            padding: 22px 0;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            overflow-y: auto;
            z-index: 1000;
        }

        .sidebar-brand {
            padding: 0 22px 26px;
            border-bottom: 1px solid var(--border-soft);
            margin-bottom: 16px;
            flex-shrink: 0;
        }

        .sidebar-brand h2 {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 800;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-brand h2 i { color: var(--gold); }

        .sidebar-brand span {
            display: block;
            margin-top: 4px;
            font-size: 0.68rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-faint);
        }

        .secretary-nav-item,
        .admin-nav-item,
        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 22px;
            color: var(--text-soft);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 500;
            border-left: 3px solid transparent;
            transition: all 0.18s ease;
            flex-shrink: 0;
        }

        .secretary-nav-item i,
        .admin-nav-item i,
        .nav-link i { width: 18px; text-align: center; }

        .secretary-nav-item:hover,
        .admin-nav-item:hover,
        .nav-link:hover {
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
            border-left-color: rgba(201, 169, 97, 0.5);
        }

        .secretary-nav-item.active {
            background: rgba(201, 169, 97, 0.08);
            border-left-color: var(--gold-light);
            color: var(--gold-light);
        }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid var(--border-soft);
            flex-shrink: 0;
        }

        /* ==================== MAIN ==================== */
        .secretary-main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 28px 34px 40px;
            min-width: 0;
            width: calc(100% - var(--sidebar-width));
        }

        /* ==================== CARDS ==================== */
        .minutes-card,
        .saved-minutes-card,
        .chat-container {
            background: var(--bg-card);
            border: 1px solid var(--border-soft);
            border-radius: 18px;
            padding: 24px;
            margin-bottom: 22px;
        }

        .card-title {
            margin: 0 0 18px;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-strong);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title i { color: var(--gold); font-size: 0.95rem; }

        .card-title .count-pill {
            margin-left: auto;
            background: rgba(201, 169, 97, 0.14);
            color: var(--gold-light);
            font-size: 0.7rem;
            font-weight: 700;
            padding: 3px 11px;
            border-radius: 20px;
        }

        /* ==================== TEXTAREA ==================== */
        .minutes-textarea {
            width: 100%;
            min-height: 200px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border-med);
            border-radius: 12px;
            padding: 14px 16px;
            color: #fff;
            font-family: inherit;
            font-size: 0.88rem;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .minutes-textarea:focus {
            border-color: rgba(201, 169, 97, 0.45);
            box-shadow: 0 0 0 3px rgba(201, 169, 97, 0.08);
        }

        .minutes-textarea::placeholder { color: rgba(255, 255, 255, 0.25); }

        .minutes-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .btn-minutes {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 11px;
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border-med);
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.8);
            transition: all 0.18s ease;
        }

        .btn-minutes:hover {
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            transform: translateY(-1px);
        }

        .btn-minutes.primary {
            background: linear-gradient(135deg, #c9a961, #e0bf75);
            border-color: transparent;
            color: #0a1420;
            box-shadow: 0 4px 14px rgba(201, 169, 97, 0.22);
        }

        .btn-minutes.primary:hover {
            box-shadow: 0 8px 22px rgba(201, 169, 97, 0.35);
        }

        .btn-minutes.editing {
            background: linear-gradient(135deg, #f5c542, #ffd966);
            border-color: transparent;
            color: #0a1420;
            box-shadow: 0 4px 14px rgba(245, 197, 66, 0.28);
        }

        .btn-minutes.danger {
            color: #ff8a8a;
            border-color: rgba(255, 107, 107, 0.3);
            background: rgba(255, 107, 107, 0.06);
        }

        .minutes-status {
            margin-left: auto;
            font-size: 0.72rem;
            color: var(--text-faint);
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-soft);
        }

        .minutes-status .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4caf50;
        }

        /* ==================== SAVED MINUTES ==================== */
        .saved-minutes-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .minute-entry {
            background: rgba(0, 0, 0, 0.22);
            border: 1px solid var(--border-soft);
            border-radius: 14px;
            padding: 18px 20px;
            transition: border-color 0.2s, background 0.2s, opacity 0.25s, transform 0.25s;
        }

        .minute-entry:hover {
            border-color: rgba(201, 169, 97, 0.25);
            background: rgba(0, 0, 0, 0.28);
        }

        .minute-entry.removing {
            opacity: 0;
            transform: translateX(-20px);
        }

        .minute-content {
            font-size: 0.88rem;
            line-height: 1.65;
            color: rgba(255, 255, 255, 0.85);
            white-space: pre-wrap;
            word-wrap: break-word;
            margin-bottom: 14px;
        }

        .minute-content .preview-text,
        .minute-content .full-text {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .btn-read-more {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            color: var(--gold-light);
            cursor: pointer;
            font-family: inherit;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0;
            margin-top: 6px;
        }

        .btn-read-more:hover { opacity: 0.75; }

        .minute-meta {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
            font-size: 0.73rem;
            color: rgba(255, 255, 255, 0.42);
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-soft);
            margin-bottom: 12px;
        }

        .minute-meta span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .minute-meta i { color: rgba(201, 169, 97, 0.65); }

        .minute-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-mini {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 13px;
            border-radius: 9px;
            font-family: inherit;
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border-med);
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.65);
            transition: all 0.15s ease;
        }

        .btn-mini:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }

        .btn-mini.print:hover  { color: #00e0ff; border-color: rgba(0, 224, 255, 0.3); }
        .btn-mini.edit:hover   { color: #f5c542; border-color: rgba(245, 197, 66, 0.3); }
        .btn-mini.delete:hover { color: #ff6b6b; border-color: rgba(255, 107, 107, 0.35); }

        .badge-saved {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.68rem;
            font-weight: 700;
            color: #4ade80;
            background: rgba(74, 222, 128, 0.08);
            border: 1px solid rgba(74, 222, 128, 0.2);
            padding: 4px 10px;
            border-radius: 20px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255, 255, 255, 0.28);
        }

        .empty-state i {
            font-size: 2rem;
            color: rgba(201, 169, 97, 0.35);
            display: block;
            margin-bottom: 12px;
        }

        .empty-state p {
            margin: 0;
            font-size: 0.85rem;
        }

        /* ==================== CHAT ==================== */
        .chat-layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 18px;
            min-height: 480px;
        }

        .member-list {
            background: rgba(0, 0, 0, 0.22);
            border: 1px solid var(--border-soft);
            border-radius: 14px;
            padding: 14px 0;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .member-list > h4 {
            margin: 0 0 10px;
            padding: 0 18px 12px;
            font-size: 0.75rem;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            font-weight: 600;
            color: var(--text-faint);
            border-bottom: 1px solid var(--border-soft);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #memberListContainer {
            flex: 1;
            overflow-y: auto;
            padding: 6px 0;
        }

        .member-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 18px;
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: all 0.15s ease;
            position: relative;
        }

        .member-item:hover { background: rgba(255, 255, 255, 0.03); }

        .member-item.active {
            background: linear-gradient(90deg, rgba(201, 169, 97, 0.08), transparent);
            border-left-color: var(--gold-light);
        }

        .member-item .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            color: #0a1420;
            flex-shrink: 0;
        }

        .member-item .info { flex: 1; min-width: 0; }

        .member-item .name {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-strong);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .member-item .status {
            font-size: 0.7rem;
            color: var(--text-faint);
            margin-top: 3px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .member-unread {
            background: #ff6b6b;
            color: #fff;
            font-size: 0.62rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
        }

        .chat-area {
            background: rgba(0, 0, 0, 0.22);
            border: 1px solid var(--border-soft);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 22px;
            border-bottom: 1px solid var(--border-soft);
            background: linear-gradient(90deg, rgba(201, 169, 97, 0.08), transparent);
        }

        .chat-with {
            display: block;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .chat-role {
            display: block;
            font-size: 0.72rem;
            color: var(--text-faint);
            margin-top: 2px;
        }

        .chat-messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 22px 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 0;
        }

        .no-member-selected {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-faint);
            text-align: center;
            gap: 10px;
        }

        .no-member-selected i { font-size: 2.4rem; color: rgba(201, 169, 97, 0.3); }
        .no-member-selected p { margin: 0; font-size: 0.85rem; }

        .chat-message {
            max-width: 72%;
            padding: 11px 15px;
            border-radius: 14px;
            font-size: 0.87rem;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .chat-message.official {
            align-self: flex-end;
            background: linear-gradient(135deg, #c9a961, #e0bf75);
            color: #0a1420;
            border-bottom-right-radius: 4px;
        }

        .chat-message.member {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-soft);
            color: var(--text-strong);
            border-bottom-left-radius: 4px;
        }

        .chat-message .sender {
            font-size: 0.68rem;
            font-weight: 600;
            opacity: 0.75;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chat-message .time {
            font-size: 0.62rem;
            opacity: 0.6;
            margin-top: 6px;
            text-align: right;
        }

        .chat-message.member .time { text-align: left; }

        .chat-input-area {
            display: flex;
            gap: 10px;
            align-items: stretch;
            padding: 14px 18px;
            border-top: 1px solid var(--border-soft);
            background: rgba(0, 0, 0, 0.15);
        }

        .chat-input-area select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-med);
            color: rgba(255, 255, 255, 0.75);
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 0 12px;
            border-radius: 11px;
            outline: none;
            cursor: pointer;
            min-width: 130px;
        }

        .chat-input-area select option { background: #0a1420; color: #fff; }

        .chat-input-area input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-med);
            border-radius: 11px;
            padding: 12px 16px;
            color: #fff;
            font-family: inherit;
            font-size: 0.88rem;
            outline: none;
        }

        .chat-input-area input:focus {
            border-color: rgba(201, 169, 97, 0.45);
            box-shadow: 0 0 0 3px rgba(201, 169, 97, 0.08);
        }

        .chat-input-area input:disabled { opacity: 0.5; cursor: not-allowed; }

        .chat-input-area button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0 22px;
            border-radius: 11px;
            border: none;
            background: linear-gradient(135deg, #c9a961, #e0bf75);
            color: #0a1420;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chat-input-area button:hover:not(:disabled) { transform: translateY(-1px); }
        .chat-input-area button:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 900px) {
            :root {
                --sidebar-width: 72px;
            }
            .secretary-sidebar {
                width: 72px;
                padding: 20px 0;
            }
            .sidebar-brand {
                padding: 0 10px 20px;
                text-align: center;
            }
            .sidebar-brand h2 {
                justify-content: center;
                font-size: 1.2rem;
            }
            .sidebar-brand h2 span,
            .sidebar-brand > span {
                display: none;
            }
            .secretary-nav-item,
            .admin-nav-item,
            .nav-link {
                justify-content: center;
                padding: 14px 0;
                gap: 0;
            }
            .secretary-nav-item span,
            .admin-nav-item span,
            .nav-link .nav-text {
                display: none;
            }
            .secretary-nav-item i,
            .admin-nav-item i,
            .nav-link i {
                width: auto;
                font-size: 1.1rem;
                margin: 0;
            }
            .secretary-main-content {
                margin-left: 72px;
                width: calc(100% - 72px);
                padding: 20px;
            }
            .chat-layout {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 620px) {
            .secretary-main-content {
                padding: 14px;
            }
            .minutes-card,
            .saved-minutes-card,
            .chat-container {
                border-radius: 14px;
                padding: 16px;
            }
            .chat-input-area {
                flex-direction: column;
            }
            .chat-input-area select {
                min-width: unset;
                padding: 10px 12px;
            }
            .chat-input-area button {
                padding: 12px 22px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<!-- ==================== SIDEBAR ==================== -->
<nav class="secretary-sidebar">
    <div class="sidebar-brand">
        <h2><i class="fas fa-clipboard-list"></i> <span>Karacel</span></h2>
        <span>Secretary Portal</span>
    </div>

    <a class="secretary-nav-item" href="/treasurer/dashboard">
        <i class="fas fa-chart-pie"></i> <span>Dashboard</span>
    </a>
    <a class="secretary-nav-item active" href="#">
        <i class="fas fa-pen-fancy"></i> <span>Minutes</span>
    </a>
    <a href="{{ url_for('chat_api.treasurer_chat') }}" class="admin-nav-item">
        <i class="fas fa-comments"></i> <span>Chat Center</span>
    </a>
    <a href="{{ url_for('member_dashboard', staff_view=True) }}" class="nav-link">
        <i class="fas fa-user-circle"></i> <span class="nav-text">My Portal</span>
    </a>

    <div class="sidebar-footer">
        <a href="/logout" class="secretary-nav-item" style="color: #ff6b6b;">
            <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
        </a>
    </div>
</nav>

<!-- ==================== MAIN CONTENT ==================== -->
<div class="secretary-main-content">

    <!-- ==================== MINUTES COMPOSER ==================== -->
    <div class="minutes-card">
        <h3 class="card-title">
            <i class="fas fa-pen-fancy"></i>
            <span id="composerTitle">Meeting Minutes</span>
        </h3>

        <textarea
            id="minutesTextarea"
            class="minutes-textarea"
            placeholder="Write meeting minutes here..."></textarea>

        <div class="minutes-actions">
            <button id="saveMinutesBtn" class="btn-minutes primary">
                <i class="fas fa-check-circle"></i>
                <span id="saveBtnLabel">Save minutes</span>
            </button>

            <button id="cancelEditBtn" class="btn-minutes danger" style="display:none;">
                <i class="fas fa-times"></i> Cancel edit
            </button>

            <button id="printAllBtn" class="btn-minutes">
                <i class="fas fa-print"></i> Print all
            </button>

            <div class="minutes-status">
                <span class="dot" id="statusDot"></span>
                <span id="statusText">Ready</span>
            </div>
        </div>
    </div>

    <!-- ==================== SAVED MINUTES ==================== -->
    <div class="saved-minutes-card">
        <h3 class="card-title">
            <i class="fas fa-archive"></i>
            Saved minutes
            <span class="count-pill" id="savedCount">0</span>
        </h3>

        <div class="saved-minutes-list" id="minutesListContainer">
            <!-- JS renders here -->
        </div>
    </div>

    <!-- ==================== CHAT ==================== -->
    <div class="chat-container">
        <h3 class="card-title"><i class="fas fa-comments"></i> Member Chat</h3>
        <div class="chat-layout">

            <div class="member-list">
                <h4><i class="fas fa-users"></i> Members</h4>
                <div id="memberListContainer">
                    <div style="text-align:center; padding:20px; color:rgba(255,255,255,0.3);">
                        <i class="fas fa-spinner fa-spin"></i> Loading members...
                    </div>
                </div>
            </div>

            <div class="chat-area">
                <div class="chat-header">
                    <div>
                        <span class="chat-with" id="chatWith">Select a member</span>
                        <span class="chat-role" id="chatRole"></span>
                    </div>
                    <div id="memberStatus">
                        <span style="font-size:0.7rem; color:rgba(255,255,255,0.2);">
                            <i class="fas fa-circle" style="color:#666;"></i> Offline
                        </span>
                    </div>
                </div>

                <div class="chat-messages-area" id="chatMessages">
                    <div class="no-member-selected">
                        <i class="fas fa-comment-dots"></i>
                        <p>Select a member to start chatting</p>
                    </div>
                </div>

                <div class="chat-input-area">
                    <select id="chatType">
                        <option value="general">General</option>
                        <option value="loan">Loan Inquiry</option>
                        <option value="savings">Savings Inquiry</option>
                        <option value="complaint">Complaint</option>
                        <option value="suggestion">Suggestion</option>
                    </select>
                    <input type="text" id="chatInput" placeholder="Select a member to begin..." disabled>
                    <button id="sendChatBtn" disabled>
                        <i class="fas fa-paper-plane"></i> Send
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
(function () {
    "use strict";

    // ============================================================
    // MINUTES SYSTEM — save, edit, delete, print
    // ============================================================
    const STORAGE_KEY   = 'karacel_minutes';
    const textarea      = document.getElementById('minutesTextarea');
    const saveBtn       = document.getElementById('saveMinutesBtn');
    const saveBtnLabel  = document.getElementById('saveBtnLabel');
    const cancelEditBtn = document.getElementById('cancelEditBtn');
    const printAllBtn   = document.getElementById('printAllBtn');
    const statusText    = document.getElementById('statusText');
    const statusDot     = document.getElementById('statusDot');
    const composerTitle = document.getElementById('composerTitle');
    const listContainer = document.getElementById('minutesListContainer');
    const savedCountEl  = document.getElementById('savedCount');

    let editingId   = null;
    let statusTimer = null;

    function loadMinutes() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
        catch { return []; }
    }

    function saveMinutesToStorage(list) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    }

    function setStatus(msg, color) {
        statusText.textContent = msg;
        statusDot.style.background = color || '#4caf50';
        statusDot.style.boxShadow = '0 0 8px ' + (color || '#4caf50');
        if (statusTimer) clearTimeout(statusTimer);
        if (!msg.startsWith('Editing')) {
            statusTimer = setTimeout(function () {
                statusText.textContent = 'Ready';
                statusDot.style.background = '#4caf50';
                statusDot.style.boxShadow = '0 0 8px #4caf50';
            }, 2500);
        }
    }

    function escapeHtml(text) {
        if (text == null) return '';
        return String(text).replace(/[&<>"']/g, function (c) {
            return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
        });
    }

    function handleSave() {
        const content = textarea.value.trim();
        if (!content) {
            setStatus('Write something first', '#ff6b6b');
            textarea.focus();
            return;
        }

        let list = loadMinutes();
        const now = new Date();

        if (editingId !== null) {
            const idx = list.findIndex(m => m.id === editingId);
            if (idx !== -1) {
                list[idx].content = content;
                list[idx].editedAt = now.toISOString();
                setStatus('Updated', '#00e0ff');
            }
            resetEditMode();
        } else {
            list.unshift({
                id: Date.now(),
                content: content,
                date: now.toLocaleDateString('en-US', {
                    year: 'numeric', month: 'short', day: 'numeric'
                }),
                time: now.toLocaleTimeString('en-US', {
                    hour: '2-digit', minute: '2-digit'
                }),
                timestamp: now.toISOString()
            });
            setStatus('Saved!', '#4caf50');
        }

        if (list.length > 50) list = list.slice(0, 50);
        saveMinutesToStorage(list);
        textarea.value = '';
        renderList(list);
    }

    function renderList(list) {
        savedCountEl.textContent = list.length;

        if (!list.length) {
            listContainer.innerHTML =
                '<div class="empty-state">' +
                    '<i class="fas fa-inbox"></i>' +
                    '<p>No saved minutes yet. Write one above and click "Save minutes".</p>' +
                '</div>';
            return;
        }

        listContainer.innerHTML = list.map(function (item) {
            const content   = item.content || '';
            const isLong    = content.length > 200;
            const preview   = isLong ? content.substring(0, 200) + '…' : content;
            const editedTag = item.editedAt ? ' <em style="color:#00e0ff;font-style:normal;">· edited</em>' : '';

            return (
                '<div class="minute-entry" data-id="' + item.id + '">' +
                    '<div class="minute-content">' +
                        '<div class="preview-text">' + escapeHtml(preview) + '</div>' +
                        (isLong
                            ? '<div class="full-text" style="display:none;">' + escapeHtml(content) + '</div>' +
                              '<button class="btn-read-more" data-action="toggle">' +
                                  '<i class="fas fa-chevron-down"></i> Read more' +
                              '</button>'
                            : '') +
                    '</div>' +
                    '<div class="minute-meta">' +
                        '<span><i class="far fa-calendar-alt"></i> ' + escapeHtml(item.date || '') + '</span>' +
                        '<span><i class="far fa-clock"></i> ' + escapeHtml(item.time || '') + '</span>' +
                        '<span><i class="far fa-user"></i> Secretary' + editedTag + '</span>' +
                    '</div>' +
                    '<div class="minute-actions">' +
                        '<button class="btn-mini print"  data-action="print"><i class="fas fa-print"></i> Print</button>' +
                        '<button class="btn-mini edit"   data-action="edit"><i class="fas fa-pen"></i> Edit</button>' +
                        '<button class="btn-mini delete" data-action="delete"><i class="fas fa-trash"></i> Delete</button>' +
                        '<span class="badge-saved"><i class="fas fa-check-circle"></i> Saved</span>' +
                    '</div>' +
                '</div>'
            );
        }).join('');
    }

    listContainer.addEventListener('click', function (e) {
        const btn = e.target.closest('[data-action]');
        if (!btn) return;

        const entry = btn.closest('.minute-entry');
        if (!entry) return;

        const id = parseInt(entry.getAttribute('data-id'), 10);
        const action = btn.getAttribute('data-action');

        if (action === 'toggle') toggleReadMore(entry, btn);
        if (action === 'print')  printMinute(id);
        if (action === 'edit')   editMinute(id);
        if (action === 'delete') deleteMinute(id, entry);
    });

    function toggleReadMore(entry, btn) {
        const preview = entry.querySelector('.preview-text');
        const full    = entry.querySelector('.full-text');
        if (!preview || !full) return;
        const expanded = full.style.display !== 'none';
        if (expanded) {
            preview.style.display = 'block';
            full.style.display = 'none';
            btn.innerHTML = '<i class="fas fa-chevron-down"></i> Read more';
        } else {
            preview.style.display = 'none';
            full.style.display = 'block';
            btn.innerHTML = '<i class="fas fa-chevron-up"></i> Read less';
        }
    }

    function deleteMinute(id, entry) {
        if (!confirm('Delete this minute? This cannot be undone.')) return;

        entry.classList.add('removing');

        let list = loadMinutes().filter(m => m.id !== id);
        saveMinutesToStorage(list);

        setTimeout(function () {
            renderList(list);
            setStatus('Deleted', '#ff6b6b');
        }, 220);
    }

    function editMinute(id) {
        const item = loadMinutes().find(m => m.id === id);
        if (!item) return;

        textarea.value = item.content;
        textarea.focus();
        textarea.scrollIntoView({ behavior: 'smooth', block: 'center' });

        editingId = id;
        saveBtnLabel.textContent = 'Update minutes';
        saveBtn.classList.remove('primary');
        saveBtn.classList.add('editing');
        composerTitle.textContent = 'Editing — ' + (item.date || '');
        cancelEditBtn.style.display = '';
        setStatus('Editing • ' + (item.date || ''), '#f5c542');
    }

    function resetEditMode() {
        editingId = null;
        saveBtnLabel.textContent = 'Save minutes';
        saveBtn.classList.remove('editing');
        saveBtn.classList.add('primary');
        composerTitle.textContent = 'Meeting Minutes';
        cancelEditBtn.style.display = 'none';
    }

    function printHtml(html) {
        let w = null;
        try { w = window.open('', '_blank', 'width=900,height=700'); } catch (e) { w = null; }

        if (w && w.document) {
            w.document.open();
            w.document.write(html);
            w.document.close();
            setTimeout(function () {
                try { w.focus(); w.print(); } catch (_) {}
            }, 250);
            return;
        }

        const iframe = document.createElement('iframe');
        iframe.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
        document.body.appendChild(iframe);

        const doc = iframe.contentWindow.document;
        doc.open();
        doc.write(html);
        doc.close();

        setTimeout(function () {
            try {
                iframe.contentWindow.focus();
                iframe.contentWindow.print();
            } catch (e) {
                console.error('Print failed:', e);
                alert('Could not open print dialog. Please allow popups for this site.');
            } finally {
                setTimeout(function () {
                    if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
                }, 1000);
            }
        }, 300);
    }

    function printMinute(id) {
        const item = loadMinutes().find(m => m.id === id);
        if (!item) { alert('Minute not found.'); return; }

        const html =
            '<!DOCTYPE html><html><head><title>Minutes — ' + escapeHtml(item.date) + '</title>' +
            '<style>' +
            'body{font-family:Georgia,serif;max-width:780px;margin:44px auto;padding:24px;line-height:1.7;color:#222;}' +
            '.header{border-bottom:2px solid #333;padding-bottom:18px;margin-bottom:24px;text-align:center;}' +
            '.header h1{margin:0;font-size:22px;letter-spacing:1px;}' +
            '.header .sub{color:#666;font-size:13px;margin-top:6px;}' +
            '.content{white-space:pre-wrap;font-size:14px;padding:10px 0;}' +
            '.footer{margin-top:40px;border-top:1px solid #ddd;padding-top:16px;font-size:12px;color:#888;text-align:center;}' +
            '@media print{body{margin:20px;}}' +
            '</style></head><body>' +
            '<div class="header">' +
                '<h1>MEETING MINUTES</h1>' +
                '<div class="sub">' + escapeHtml(item.date) + ' at ' + escapeHtml(item.time) +
                    ' &middot; Prepared by Secretary</div>' +
            '</div>' +
            '<div class="content">' + escapeHtml(item.content) + '</div>' +
            '<div class="footer">Computer-generated document &middot; ' +
                escapeHtml(item.date) + ' ' + escapeHtml(item.time) + '</div>' +
            '</body></html>';

        printHtml(html);
    }

    function printAll() {
        const list = loadMinutes();
        if (!list.length) { alert('No minutes to print.'); return; }

        let body = '';
        list.forEach(function (item, i) {
            body +=
                '<div style="margin-bottom:40px;' +
                    (i > 0 ? 'border-top:2px dashed #ccc;padding-top:30px;' : '') +
                '">' +
                    '<div style="border-bottom:1px solid #ddd;padding-bottom:10px;margin-bottom:14px;">' +
                        '<strong style="font-size:15px;">MINUTES #' + (i + 1) + '</strong>' +
                        '<span style="color:#666;font-size:13px;margin-left:20px;">' +
                            escapeHtml(item.date) + ' at ' + escapeHtml(item.time) +
                        '</span>' +
                    '</div>' +
                    '<div style="white-space:pre-wrap;font-size:13px;line-height:1.7;">' +
                        escapeHtml(item.content) +
                    '</div>' +
                '</div>';
        });

        const html =
            '<!DOCTYPE html><html><head><title>All Meeting Minutes</title>' +
            '<style>' +
            'body{font-family:Georgia,serif;max-width:800px;margin:30px auto;padding:20px;line-height:1.6;color:#222;}' +
            '.header{text-align:center;border-bottom:3px solid #333;padding-bottom:20px;margin-bottom:30px;}' +
            '.header h1{margin:0;letter-spacing:1px;}' +
            '.header .sub{color:#666;margin-top:6px;}' +
            '@media print{body{margin:15px;}}' +
            '</style></head><body>' +
            '<div class="header"><h1>ALL MEETING MINUTES</h1>' +
            '<div class="sub">Total: ' + list.length + ' entries &middot; Printed ' +
                new Date().toLocaleString() + '</div></div>' +
            body +
            '<div style="text-align:center;color:#888;font-size:12px;margin-top:40px;border-top:1px solid #ddd;padding-top:20px;">' +
                'Computer-generated document</div>' +
            '</body></html>';

        printHtml(html);
    }

    saveBtn.addEventListener('click', handleSave);

    cancelEditBtn.addEventListener('click', function () {
        textarea.value = '';
        resetEditMode();
        setStatus('Cancelled', '#ffaa33');
        textarea.focus();
    });

    printAllBtn.addEventListener('click', printAll);

    // ============================================================
    // CHAT
    // ============================================================
    let currentMemberId = null;
    let chatMembers = [];

    function loadMembers() {
        fetch('/api/members/list')
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    chatMembers = data.members;
                    renderMemberList(chatMembers);
                } else {
                    showMemberListError('Failed to load members');
                }
            })
            .catch(err => {
                console.error('Error loading members:', err);
                showMemberListError('Error loading members. Please refresh.');
            });
    }

    function renderMemberList(members) {
        const container = document.getElementById('memberListContainer');
        if (!members || members.length === 0) {
            container.innerHTML =
                '<div style="text-align:center;padding:20px;color:rgba(255,255,255,0.3);">' +
                    '<i class="fas fa-users" style="font-size:2rem;display:block;margin-bottom:8px;opacity:0.15;"></i>' +
                    'No members found</div>';
            return;
        }

        let html = '';
        members.forEach(member => {
            const initials = member.full_name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
            const isActive = member.status === 'active';
            const hasUnread = member.unread_count > 0;
            html +=
                '<div class="member-item ' + (currentMemberId === member.id ? 'active' : '') + '"' +
                     ' onclick="window.__selectMember(' + member.id + ')"' +
                     ' data-member-id="' + member.id + '">' +
                    '<div class="avatar" style="background:' + getRandomColor(member.id) + ';">' + initials + '</div>' +
                    '<div class="info">' +
                        '<div class="name">' + escapeHtml(member.full_name) + '</div>' +
                        '<div class="status">' +
                            '<i class="fas fa-circle" style="color:' + (isActive ? '#4ade80' : '#666') + ';font-size:0.4rem;"></i> ' +
                            (isActive ? 'Active' : 'Inactive') + ' • ' + escapeHtml(member.sacco_number || '') +
                        '</div>' +
                    '</div>' +
                    (hasUnread ? '<span class="member-unread">' + member.unread_count + '</span>' : '') +
                '</div>';
        });
        container.innerHTML = html;
    }

    function showMemberListError(message) {
        document.getElementById('memberListContainer').innerHTML =
            '<div style="text-align:center;padding:20px;color:rgba(255,107,107,0.7);">' +
                '<i class="fas fa-exclamation-circle" style="font-size:2rem;display:block;margin-bottom:8px;"></i>' +
                message + '</div>';
    }

    function getRandomColor(id) {
        const colors = ['#e0bf75', '#00e0ff', '#4ade80', '#a78bfa', '#ff6b6b', '#f472b6', '#34d399', '#60a5fa'];
        return colors[id % colors.length];
    }

    window.__selectMember = function (memberId) {
        currentMemberId = memberId;
        document.querySelectorAll('.member-item').forEach(item => {
            item.classList.remove('active');
            if (parseInt(item.dataset.memberId) === memberId) item.classList.add('active');
        });

        const member = chatMembers.find(m => m.id === memberId);
        if (member) {
            document.getElementById('chatWith').textContent = member.full_name;
            document.getElementById('chatRole').textContent = 'SACCO: ' + (member.sacco_number || '—');
            document.getElementById('memberStatus').innerHTML =
                '<span style="font-size:0.7rem;color:' + (member.status === 'active' ? '#4ade80' : 'rgba(255,255,255,0.2)') + ';">' +
                    '<i class="fas fa-circle" style="color:' + (member.status === 'active' ? '#4ade80' : '#666') + ';"></i> ' +
                    (member.status === 'active' ? 'Online' : 'Offline') +
                '</span>';
        }

        const input = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendChatBtn');
        input.disabled = false;
        sendBtn.disabled = false;
        input.placeholder = 'Type your message...';
        input.focus();

        loadMessages(memberId);
        markMessagesAsRead(memberId);
    };

    function loadMessages(memberId) {
        if (!memberId) return;
        fetch('/api/chat/messages/' + memberId)
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    renderMessages(data.messages);
                    scrollToBottom();
                }
            })
            .catch(err => console.error('Error loading messages:', err));
    }

    function renderMessages(messages) {
        const container = document.getElementById('chatMessages');
        if (!messages || messages.length === 0) {
            container.innerHTML =
                '<div class="no-member-selected">' +
                    '<i class="fas fa-comment-dots"></i>' +
                    '<p>No messages yet. Start a conversation!</p></div>';
            return;
        }

        let html = '';
        let lastDate = '';
        messages.forEach(msg => {
            const raw = String(msg.created_at || '').replace(' ', 'T');
            const d = new Date(raw.endsWith('Z') ? raw : raw + 'Z');
            const msgDate = d.toLocaleDateString();
            const msgTime = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            if (msgDate !== lastDate) {
                html += '<div style="text-align:center;padding:8px 0;color:rgba(255,255,255,0.18);font-size:0.65rem;">' +
                        msgDate + '</div>';
                lastDate = msgDate;
            }

            const isOfficial = ['admin', 'secretary', 'treasurer', 'chairperson', 'publicity']
                .includes((msg.sender_role || '').toLowerCase());
            const senderName = isOfficial ? 'Karacel ' + capitalize(msg.sender_role) : (msg.sender_name || 'Member');

            html +=
                '<div class="chat-message ' + (isOfficial ? 'official' : 'member') + '">' +
                    '<div class="sender"><i class="fas ' + (isOfficial ? 'fa-user-tie' : 'fa-user') + '"></i> ' +
                        escapeHtml(senderName) + '</div>' +
                    '<div class="text">' + escapeHtml(msg.message) + '</div>' +
                    '<div class="time">' + msgTime + '</div>' +
                '</div>';
        });
        container.innerHTML = html;
    }

    function capitalize(s) {
        if (!s) return '';
        return s.charAt(0).toUpperCase() + s.slice(1);
    }

    function scrollToBottom() {
        const c = document.getElementById('chatMessages');
        c.scrollTop = c.scrollHeight;
    }

    function sendMessage() {
        if (!currentMemberId) { alert('Please select a member first.'); return; }
        const input = document.getElementById('chatInput');
        const message = input.value.trim();
        const chatType = document.getElementById('chatType').value;
        if (!message) { input.focus(); return; }

        const sendBtn = document.getElementById('sendChatBtn');
        sendBtn.disabled = true;
        sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';

        fetch('/api/chat/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ member_id: currentMemberId, message: message, type: chatType })
        })
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                input.value = '';
                loadMessages(currentMemberId);
            } else {
                alert('Failed to send message: ' + (data.message || 'Unknown error'));
            }
        })
        .catch(err => {
            console.error('Error sending message:', err);
            alert('Error sending message. Please try again.');
        })
        .finally(() => {
            sendBtn.disabled = false;
            sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Send';
            input.focus();
        });
    }

    function markMessagesAsRead(memberId) {
        if (!memberId) return;
        fetch('/api/chat/mark-read', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ member_id: memberId })
        }).then(r => r.json()).catch(err => console.error(err));
    }

    document.getElementById('sendChatBtn').addEventListener('click', sendMessage);

    document.getElementById('chatInput').addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    loadMembers();
    setInterval(function () {
        if (currentMemberId) loadMessages(currentMemberId);
    }, 5000);

    renderList(loadMinutes());

    console.log('✅ Secretary dashboard + minutes ready');
})();
</script>

</body>
</html>
