<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Secretary Dashboard{% endblock %} | Karacel SACCO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a14;
            color: #fff;
            min-height: 100vh;
            display: flex;
        }

        .secretary-sidebar {
            width: 250px;
            min-height: 100vh;
            background: linear-gradient(180deg, #0f0f1f, #0a0a14);
            border-right: 1px solid rgba(255,255,255,0.04);
            padding: 20px 0;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-brand {
            padding: 0 20px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            margin-bottom: 20px;
        }

        .sidebar-brand h2 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #f5c542;
        }

        .sidebar-brand h2 i {
            color: #00e0ff;
            margin-right: 8px;
        }

        .sidebar-brand span {
            display: block;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.25);
            margin-top: 2px;
        }

        .secretary-nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 20px;
            color: rgba(255,255,255,0.4);
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border-left: 3px solid transparent;
            font-size: 0.85rem;
        }

        .secretary-nav-item:hover {
            color: rgba(255,255,255,0.8);
            background: rgba(255,255,255,0.02);
        }

        .secretary-nav-item.active {
            color: #00e0ff;
            background: rgba(0,224,255,0.05);
            border-left-color: #00e0ff;
        }

        .secretary-nav-item i {
            width: 20px;
            text-align: center;
            font-size: 1rem;
        }

        .sidebar-footer {
            margin-top: auto;
            padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.04);
        }

        .sidebar-footer .secretary-nav-item {
            color: #ff6b6b;
        }

        .secretary-main-content {
            flex: 1;
            padding: 20px 30px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.02);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.2);
        }

        /* Minutes Styles */
        .minutes-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 20px;
            padding: 24px 28px;
            margin-top: 24px;
            backdrop-filter: blur(2px);
        }

        .minutes-card h3 {
            font-weight: 600;
            font-size: 1.3rem;
            color: #f5c542;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .minutes-card h3 i {
            color: #00e0ff;
        }

        .minutes-textarea {
            width: 100%;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 18px 20px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            color: #eaeef2;
            resize: vertical;
            min-height: 200px;
            transition: border 0.2s;
            line-height: 1.6;
        }

        .minutes-textarea:focus {
            outline: none;
            border-color: #00e0ff;
            box-shadow: 0 0 0 3px rgba(0,224,255,0.15);
        }

        .minutes-textarea::placeholder {
            color: rgba(255,255,255,0.25);
            font-weight: 300;
        }

        .minutes-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 20px;
            align-items: center;
        }

        .btn-minutes {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.08);
            padding: 10px 28px;
            border-radius: 40px;
            color: #fff;
            font-weight: 500;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(0,224,255,0.03);
        }

        .btn-minutes i {
            font-size: 0.95rem;
        }

        .btn-minutes:hover {
            background: rgba(0,224,255,0.12);
            border-color: #00e0ff;
            color: #00e0ff;
            transform: translateY(-1px);
        }

        .btn-minutes.primary {
            background: #00e0ff;
            border-color: #00e0ff;
            color: #0a0a14;
            font-weight: 600;
        }

        .btn-minutes.primary:hover {
            background: #66ecff;
            border-color: #66ecff;
            color: #0a0a14;
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(0,224,255,0.25);
        }

        .minutes-status {
            margin-left: auto;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.25);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .minutes-status i {
            color: #4caf50;
        }

        .saved-minutes-list {
            margin-top: 28px;
            border-top: 1px solid rgba(255,255,255,0.04);
            padding-top: 20px;
        }

        .saved-minutes-item {
            background: rgba(255,255,255,0.02);
            border-radius: 14px;
            padding: 16px 20px;
            margin-bottom: 12px;
            border-left: 3px solid #f5c542;
        }

        .saved-minutes-item .meta {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.2);
            letter-spacing: 0.3px;
            display: flex;
            gap: 16px;
            margin-top: 6px;
        }

        .saved-minutes-item .content-preview {
            color: rgba(255,255,255,0.7);
            font-size: 0.9rem;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .saved-minutes-item .badge {
            background: rgba(0,224,255,0.08);
            padding: 4px 12px;
            border-radius: 40px;
            color: #00e0ff;
            font-size: 0.7rem;
            font-weight: 500;
        }

        .minute-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .minute-actions button {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.7rem;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .minute-actions button:hover {
            transform: translateY(-1px);
        }

        .btn-print {
            background: rgba(0,224,255,0.08);
            border-color: rgba(0,224,255,0.1);
            color: #00e0ff;
        }

        .btn-edit {
            background: rgba(245,197,66,0.08);
            border-color: rgba(245,197,66,0.1);
            color: #f5c542;
        }

        .btn-delete {
            background: rgba(255,107,107,0.08);
            border-color: rgba(255,107,107,0.1);
            color: #ff6b6b;
        }

        .btn-toggle {
            background: transparent;
            border: none;
            color: #00e0ff;
            cursor: pointer;
            font-size: 0.8rem;
            padding: 4px 8px;
            text-decoration: underline;
            display: inline;
        }

        .btn-toggle:hover {
            color: #66ecff;
        }

        /* Chat Styles */
        .chat-container {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 20px;
            padding: 24px 28px;
            margin-top: 24px;
        }

        .chat-container h3 {
            font-weight: 600;
            font-size: 1.3rem;
            color: #f5c542;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .chat-container h3 i {
            color: #00e0ff;
        }

        .chat-layout {
            display: flex;
            gap: 20px;
            min-height: 500px;
        }

        /* Member List Sidebar */
        .member-list {
            width: 280px;
            background: rgba(0,0,0,0.2);
            border-radius: 16px;
            padding: 16px;
            max-height: 500px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .member-list h4 {
            color: rgba(255,255,255,0.4);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .member-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 4px;
            border: 1px solid transparent;
        }

        .member-item:hover {
            background: rgba(255,255,255,0.03);
            border-color: rgba(255,255,255,0.05);
        }

        .member-item.active {
            background: rgba(0,224,255,0.05);
            border-color: rgba(0,224,255,0.1);
        }

        .member-item .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00e0ff, #f5c542);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .member-item .info {
            flex: 1;
            min-width: 0;
        }

        .member-item .info .name {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.8);
            font-weight: 500;
        }

        .member-item .info .status {
            font-size: 0.65rem;
            color: rgba(255,255,255,0.2);
        }

        .member-item .online-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            flex-shrink: 0;
        }

        .member-item .online-indicator.offline {
            background: #666;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0,0,0,0.2);
            border-radius: 16px;
            padding: 16px;
            min-height: 500px;
        }

        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            margin-bottom: 12px;
        }

        .chat-header .chat-with {
            font-weight: 600;
            color: #f5c542;
        }

        .chat-header .chat-role {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.2);
        }

        .chat-messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
            min-height: 350px;
            max-height: 400px;
        }

        .chat-message {
            padding: 10px 14px;
            margin-bottom: 8px;
            border-radius: 12px;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-message.member {
            background: rgba(0,224,255,0.08);
            border: 1px solid rgba(0,224,255,0.06);
            margin-right: auto;
        }

        .chat-message.official {
            background: rgba(245,197,66,0.08);
            border: 1px solid rgba(245,197,66,0.06);
            margin-left: auto;
        }

        .chat-message .sender {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.3);
            margin-bottom: 4px;
        }

        .chat-message .sender i {
            margin-right: 4px;
        }

        .chat-message .text {
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .chat-message .time {
            font-size: 0.6rem;
            color: rgba(255,255,255,0.15);
            margin-top: 4px;
            text-align: right;
        }

        .chat-input-area {
            display: flex;
            gap: 10px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.04);
        }

        .chat-input-area select {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 10px 14px;
            color: #eaeef2;
            font-family: 'Inter', sans-serif;
            min-width: 120px;
        }

        .chat-input-area select:focus {
            outline: none;
            border-color: #00e0ff;
        }

        .chat-input-area input {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 10px 16px;
            color: #eaeef2;
            font-family: 'Inter', sans-serif;
            min-width: 150px;
        }

        .chat-input-area input:focus {
            outline: none;
            border-color: #00e0ff;
        }

        .chat-input-area input::placeholder {
            color: rgba(255,255,255,0.2);
        }

        .chat-input-area button {
            background: #00e0ff;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            color: #0a0a14;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .chat-input-area button:hover {
            background: #66ecff;
            transform: translateY(-2px);
        }

        .no-member-selected {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            height: 100%;
            color: rgba(255,255,255,0.1);
        }

        .no-member-selected i {
            font-size: 3rem;
            margin-bottom: 12px;
        }

        .no-member-selected p {
            font-size: 0.85rem;
        }

        .member-unread {
            background: #00e0ff;
            color: #0a0a14;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: auto;
        }

        @media (max-width: 768px) {
            .secretary-sidebar {
                width: 200px;
            }
            .secretary-main-content {
                padding: 15px;
            }
            .chat-layout {
                flex-direction: column;
            }
            .member-list {
                width: 100%;
                max-height: 200px;
            }
            .minutes-actions {
                flex-direction: column;
                align-items: stretch;
            }
            .minutes-status {
                margin-left: 0;
                justify-content: flex-start;
            }
            .chat-input-area {
                flex-wrap: wrap;
            }
            .chat-input-area select,
            .chat-input-area input {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <nav class="secretary-sidebar">
        <div class="sidebar-brand">
            <h2><i class="fas fa-clipboard-list"></i> Karacel</h2>
            <span>Secretary Portal</span>
        </div>

        <a class="secretary-nav-item" href="/treasurer/dashboard">
            <i class="fas fa-chart-pie"></i> Dashboard
        </a>
        </a>
        <a class="secretary-nav-item active" href="#" style="border-left-color: #f5c542; color: #f5c542;">
            <i class="fas fa-pen-fancy"></i> Minutes
        </a>
        <a class="secretary-nav-item" href="#" onclick="document.getElementById('chatSection').scrollIntoView({behavior:'smooth'})">
            <i class="fas fa-comment-dots"></i> Chat
            <span id="chatNotificationBadge" style="background:#ff6b6b; color:#fff; font-size:0.6rem; padding:1px 6px; border-radius:10px; display:none;">0</span>
        </a>

        <div class="sidebar-footer">
            <a href="/logout" class="secretary-nav-item" style="color: #ff6b6b;">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </div>
    </nav>

    <div class="secretary-main-content">
        {% block content %}{% endblock %}
    </div>

    <script>
        // Global functions for minutes
        window.toggleMinute = function(id) {
            const preview = document.getElementById('preview_' + id);
            const full = document.getElementById('full_' + id);
            const toggle = document.getElementById('toggle_' + id);
            
            if (!preview || !full || !toggle) return;
            
            if (full.style.display === 'none' || full.style.display === '') {
                preview.style.display = 'none';
                full.style.display = 'inline';
                toggle.innerHTML = '<i class="fas fa-chevron-up"></i> Read less';
                toggle.style.color = '#f5c542';
            } else {
                preview.style.display = 'inline';
                full.style.display = 'none';
                toggle.innerHTML = '<i class="fas fa-chevron-down"></i> Read more';
                toggle.style.color = '#00e0ff';
            }
        };

        window.editMinute = function(id) {
            const minutes = JSON.parse(localStorage.getItem('karacel_minutes') || '[]');
            const item = minutes.find(m => m.id == id);
            if (item) {
                const textarea = document.getElementById('minutesTextarea');
                if (textarea) {
                    textarea.value = item.content;
                    textarea.focus();
                    const updated = minutes.filter(m => m.id != id);
                    localStorage.setItem('karacel_minutes', JSON.stringify(updated));
                    if (window.renderSavedMinutes) {
                        window.renderSavedMinutes(updated);
                    }
                    const saveBtn = document.getElementById('saveMinutesBtn');
                    if (saveBtn) {
                        saveBtn.innerHTML = '<i class="fas fa-pen"></i> Update';
                        saveBtn.style.background = '#f5c542';
                        saveBtn.onclick = function() {
                            if (window.saveMinutes) window.saveMinutes();
                            saveBtn.innerHTML = '<i class="fas fa-check-circle"></i> Save minutes';
                            saveBtn.style.background = '#00e0ff';
                            saveBtn.onclick = window.saveMinutes;
                        };
                    }
                }
            }
        };

        window.deleteMinute = function(id) {
            if (!confirm('Delete these minutes?')) return;
            let minutes = JSON.parse(localStorage.getItem('karacel_minutes') || '[]');
            minutes = minutes.filter(m => m.id != id);
            localStorage.setItem('karacel_minutes', JSON.stringify(minutes));
            if (window.renderSavedMinutes) {
                window.renderSavedMinutes(minutes);
            }
        };

        window.printMinute = function(id) {
            const minutes = JSON.parse(localStorage.getItem('karacel_minutes') || '[]');
            const item = minutes.find(m => m.id == id);
            if (!item) return;
            openPrintWindow('Meeting Minutes', [item]);
        };

        window.printAllMinutes = function() {
            const minutes = JSON.parse(localStorage.getItem('karacel_minutes') || '[]');
            if (minutes.length === 0) {
                alert('No minutes to print.');
                return;
            }
            openPrintWindow('All Meeting Minutes', minutes);
        };

        function openPrintWindow(title, minutes) {
            const win = window.open('', '_blank', 'width=900,height=700');
            if (!win) {
                alert('Please allow pop-ups for printing');
                return;
            }
            
            let content = '';
            minutes.forEach((item, i) => {
                content += `
                    <div style="margin-bottom:30px; padding:20px; border-bottom:1px solid #ddd;">
                        <h2>${title} ${minutes.length > 1 ? '#' + (i+1) : ''}</h2>
                        <div style="color:#666; font-size:13px; margin-bottom:15px;">
                            Date: ${item.date || 'Unknown'} | Time: ${item.time || ''}
                        </div>
                        <div style="white-space:pre-wrap; line-height:1.8; font-size:14px;">
                            ${item.content}
                        </div>
                        <div style="margin-top:15px; padding-top:10px; border-top:1px solid #ddd; font-size:12px; color:#666;">
                            Prepared by: Secretary
                        </div>
                    </div>
                `;
            });
            
            win.document.write(`
                <html>
                    <head>
                        <title>${title} - Karacel</title>
                        <style>
                            body { font-family: Arial; padding: 40px; background: white; color: #222; }
                            h1 { text-align: center; }
                            .print-btn { text-align:center; margin:30px; }
                            button { padding:12px 30px; border:none; border-radius:6px; cursor:pointer; margin:0 10px; }
                            @media print { .print-btn { display:none; } }
                        </style>
                    </head>
                    <body>
                        <h1>${title}</h1>
                        ${content}
                        <div class="print-btn">
                            <button onclick="window.print()" style="background:#00e0ff; font-weight:bold;">Print</button>
                            <button onclick="window.close()" style="background:#ff6b6b; color:white;">Close</button>
                        </div>
                        <script>
                            setTimeout(function() { window.print(); }, 500);
                        <\/script>
                    </body>
                </html>
            `);
            win.document.close();
        }
    </script>
</body>
</html>
