<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Secretary Dashboard{% endblock %} | Karacel SACCO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='secretary.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>

<!-- ==================== SIDEBAR ==================== -->
<nav class="secretary-sidebar">
    <div class="sidebar-brand">
        <h2><i class="fas fa-clipboard-list"></i> <span>Karacel</span></h2>
        <span>Secretary Portal</span>
    </div>

    <!-- Main Dashboard — the shared treasurer dashboard -->
    <a class="secretary-nav-item {% if request.endpoint == 'treasurer_dashboard' %}active{% endif %}"
       href="{{ url_for('treasurer_dashboard') }}">
        <i class="fas fa-chart-pie"></i> <span>Dashboard</span>
    </a>

    <!-- Secretary-only Minutes page -->
    <a class="secretary-nav-item {% if request.endpoint == 'secretary_dashboard' %}active{% endif %}"
       href="{{ url_for('secretary_dashboard') }}">
        <i class="fas fa-pen-fancy"></i> <span>Minutes</span>
    </a>

    <!-- KS Interest -->
    <a class="secretary-nav-item {% if request.endpoint == 'secretary_ks_interest' %}active{% endif %}"
       href="{{ url_for('secretary_ks_interest') }}">
        <i class="fas fa-percentage"></i> <span>KS Interest</span>
    </a>

    <!-- Chat Center -->
    <a class="secretary-nav-item {% if request.endpoint == 'chat_api.treasurer_chat' %}active{% endif %}"
       href="{{ url_for('chat_api.treasurer_chat') }}">
        <i class="fas fa-comments"></i> <span>Chat Center</span>
    </a>

    <!-- Admin Overview (only for staff roles) -->
    {% if session.role in ['treasurer', 'admin', 'chairperson', 'secretary'] %}
    <a class="secretary-nav-item {% if request.endpoint == 'admin_dashboard' %}active{% endif %}"
       href="{{ url_for('admin_dashboard') }}">
        <i class="fas fa-tachometer-alt"></i> <span>Admin Overview</span>
    </a>
    {% endif %}

    <!-- My Portal -->
    <a class="secretary-nav-item {% if request.endpoint == 'member_dashboard' %}active{% endif %}"
       href="{{ url_for('member_dashboard', staff_view=True) }}">
        <i class="fas fa-user-circle"></i> <span>My Portal</span>
    </a>

    <div class="sidebar-footer">
        <a href="/logout" class="secretary-nav-item" style="color: #ff6b6b;">
            <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
        </a>
    </div>
</nav>
<!-- ==================== MAIN CONTENT ==================== -->
<div class="secretary-main-content">
    {% block content %}{% endblock %}
</div>

{% block extra_js %}{% endblock %}

</body>
</html>
