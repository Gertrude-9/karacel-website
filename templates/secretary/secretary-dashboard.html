{% extends "secretary/secretary-base.html" %}

{% block title %}Secretary Dashboard{% endblock %}

{% block content %}
<div class="secretary-dashboard">

    <!-- ====== MINUTES SECTION ====== -->
    <div class="minutes-card">
        <h3>
            <i class="fas fa-file-alt"></i>
            Draft minutes
        </h3>
        <textarea class="minutes-textarea" id="minutesTextarea" placeholder="Type meeting minutes here …&#10;Example: &#10;- The meeting was called to order at 10:00 AM.&#10;- Reviewed member savings performance.&#10;- Approved new loan applications."></textarea>

        <div class="minutes-actions">
            <button class="btn-minutes primary" id="saveMinutesBtn">
                <i class="fas fa-check-circle"></i> Save minutes
            </button>
            <button class="btn-minutes" id="clearMinutesBtn">
                <i class="fas fa-undo-alt"></i> Clear
            </button>
            <button class="btn-minutes" id="demoLoadBtn">
                <i class="fas fa-file-import"></i> Load sample
            </button>
            <span class="minutes-status" id="saveStatus">
                <i class="fas fa-circle" style="color: #4caf50; font-size: 0.5rem;"></i>
                <span id="statusText">Ready</span>
            </span>
        </div>
    </div>

    <!-- SAVED MINUTES LIST -->
    <div class="saved-minutes-list">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
            <h4 style="font-weight: 500; font-size: 0.9rem; color: rgba(255,255,255,0.3); letter-spacing: 0.5px;">
                <i class="fas fa-archive" style="margin-right: 8px;"></i>Saved minutes
            </h4>
            <button onclick="printAllMinutes()" style="background:rgba(0,224,255,0.08); border:1px solid rgba(0,224,255,0.15); color:#00e0ff; padding:6px 16px; border-radius:20px; cursor:pointer; font-size:0.7rem;">
                <i class="fas fa-print"></i> Print All
            </button>
        </div>

        <div id="minutesListContainer">
            <!-- JS will render saved minutes here -->
        </div>
    </div>

</div>

<!-- ====== COMPLETE MINUTES JAVASCRIPT ====== -->
<script>
(function() {
    "use strict";

    const textarea = document.getElementById('minutesTextarea');
    const saveBtn = document.getElementById('saveMinutesBtn');
    const clearBtn = document.getElementById('clearMinutesBtn');
    const demoBtn = document.getElementById('demoLoadBtn');
    const statusText = document.getElementById('statusText');
    const statusIcon = document.querySelector('#saveStatus i');
    const listContainer = document.getElementById('minutesListContainer');

    // ================================================================
    // SAVE MINUTES
    // ================================================================
    window.saveMinutes = function() {
        const content = textarea.value.trim();
        if (!content) {
            setStatus('Cannot save empty minutes', false, '#ff6b6b');
            return;
        }

        let saved = JSON.parse(localStorage.getItem('karacel_minutes') || '[]');
        const now = new Date();
        const dateStr = now.toLocaleDateString('en-US', {
            year: 'numeric', month: 'short', day: 'numeric'
        });
        const timeStr = now.toLocaleTimeString('en-US', {
            hour: '2-digit', minute: '2-digit'
        });

        const entry = {
            id: Date.now(),
            content: content,
            date: dateStr,
            time: timeStr,
            timestamp: now.toISOString()
        };
        saved.unshift(entry);
        if (saved.length > 20) saved = saved.slice(0, 20);
        localStorage.setItem('karacel_minutes', JSON.stringify(saved));

        renderSavedMinutes(saved);
        setStatus('Saved!', true, '#4caf50');
        textarea.value = '';

        saveBtn.innerHTML = '<i class="fas fa-check-circle"></i> Save minutes';
        saveBtn.style.background = '#00e0ff';
        saveBtn.onclick = window.saveMinutes;
    };

    // ================================================================
    // RENDER SAVED MINUTES
    // ================================================================
    window.renderSavedMinutes = function(minutesArray) {
        if (!listContainer) return;
        if (!minutesArray || minutesArray.length === 0) {
            listContainer.innerHTML = `
                <div style="text-align:center; padding: 24px 0; color: rgba(255,255,255,0.1); font-size:0.9rem;">
                    <i class="fas fa-inbox" style="display:block; font-size:1.8rem; margin-bottom:8px;"></i>
                    No saved minutes yet.
                </div>
            `;
            return;
        }

        let html = '';
        minutesArray.forEach(item => {
            const content = item.content || '';
            const isLong = content.length > 150;
            const preview = isLong ? content.substring(0, 150) + '…' : content;
            const id = item.id;

            html += `
                <div class="saved-minutes-item" id="minute-item-${id}">
                    <div>
                        <div class="content-preview">
                            <span id="preview_${id}">${escapeHtml(preview)}</span>
                            ${isLong ? `<span id="full_${id}" style="display:none;">${escapeHtml(content)}</span>` : ''}
                            ${isLong ? `<button class="btn-toggle" id="toggle_${id}" onclick="toggleMinute('${id}')"><i class="fas fa-chevron-down"></i> Read more</button>` : ''}
                        </div>
                        <div class="meta">
                            <span><i class="far fa-calendar-alt"></i> ${escapeHtml(item.date || 'unknown date')}</span>
                            <span><i class="far fa-clock"></i> ${escapeHtml(item.time || '')}</span>
                            <span><i class="far fa-user"></i> Secretary</span>
                        </div>
                        <div class="minute-actions">
                            <button class="btn-print" onclick="printMinute('${id}')"><i class="fas fa-print"></i> Print</button>
                            <button class="btn-edit" onclick="editMinute('${id}')"><i class="fas fa-edit"></i> Edit</button>
                            <button class="btn-delete" onclick="deleteMinute('${id}')"><i class="fas fa-trash"></i> Delete</button>
                            <span class="badge"><i class="fas fa-check-circle"></i> saved</span>
                        </div>
                    </div>
                </div>
            `;
        });
        listContainer.innerHTML = html;
    };

    // ================================================================
    // PRINT MINUTE
    // ================================================================
    window.printMinute = function(id) {
        const saved = JSON.parse(localStorage.getItem('karacel_minutes') || '[]');
        const item = saved.find(m => m.id === parseInt(id));
        if (!item) {
            alert('Minute not found.');
            return;
        }

        const printWindow = window.open('', '_blank', 'width=800,height=600');
        printWindow.document.write(`
            <html>
                <head>
                    <title>Meeting Minutes - ${item.date}</title>
                    <style>
                        body {
                            font-family: 'Georgia', serif;
                            max-width: 800px;
                            margin: 40px auto;
                            padding: 20px;
                            line-height: 1.6;
                            color: #222;
                        }
                        .header {
                            border-bottom: 2px solid #333;
                            padding-bottom: 20px;
                            margin-bottom: 20px;
                            text-align: center;
                        }
                        .header h1 { margin: 0; font-size: 24px; }
                        .header .sub { color: #666; font-size: 14px; }
                        .content {
                            white-space: pre-wrap;
                            font-size: 14px;
                            padding: 10px 0;
                        }
                        .footer {
                            margin-top: 40px;
                            border-top: 1px solid #ddd;
                            padding-top: 20px;
                            font-size: 12px;
                            color: #666;
                            text-align: center;
                        }
                        @media print {
                            body { margin: 20px; }
                            .no-print { display: none; }
                        }
                    </style>
                </head>
                <body>
                    <div class="header">
                        <h1>📋 MEETING MINUTES</h1>
                        <div class="sub">${item.date} at ${item.time} | Prepared by: Secretary</div>
                    </div>
                    <div class="content">${escapeHtml(item.content)}</div>
                    <div class="footer">
                        <p>This is a computer-generated document.</p>
                        <p>${item.date} ${item.time}</p>
                    </div>
                    <div class="no-print" style="text-align:center; margin-top:30px;">
                        <button onclick="window.print()" style="padding:10px 30px; cursor:pointer;">🖨️ Print</button>
                        <button onclick="window.close()" style="padding:10px 30px; cursor:pointer; margin-left:10px;">Close</button>
                    </div>
                </body>
            </html>
        `);
        printWindow.document.close();
    };

    // ================================================================
    // PRINT ALL MINUTES
    // ================================================================
    window.printAllMinutes = function() {
        const saved = JSON.parse(localStorage.getItem('karacel_minutes') || '[]');
        if (saved.length === 0) {
            alert('No minutes to print.');
            return;
        }

        const printWindow = window.open('', '_blank', 'width=800,height=600');
        let contentHtml = '';
        saved.forEach((item, index) => {
            contentHtml += `
                <div style="margin-bottom: 40px; ${index > 0 ? 'border-top: 2px dashed #ccc; padding-top: 30px;' : ''}">
                    <div style="border-bottom: 1px solid #ddd; padding-bottom: 10px; margin-bottom: 15px;">
                        <strong style="font-size: 16px;">📋 MINUTES #${index + 1}</strong>
                        <span style="color: #666; font-size: 13px; margin-left: 20px;">${item.date} at ${item.time}</span>
                    </div>
                    <div style="white-space: pre-wrap; font-size: 13px; line-height: 1.7;">${escapeHtml(item.content)}</div>
                </div>
            `;
        });

        printWindow.document.write(`
            <html>
                <head>
                    <title>All Meeting Minutes</title>
                    <style>
                        body {
                            font-family: 'Georgia', serif;
                            max-width: 800px;
                            margin: 30px auto;
                            padding: 20px;
                            line-height: 1.6;
                            color: #222;
                        }
                        .header {
                            text-align: center;
                            border-bottom: 3px solid #333;
                            padding-bottom: 20px;
                            margin-bottom: 30px;
                        }
                        .header h1 { margin: 0; }
                        .header .sub { color: #666; }
                        @media print {
                            body { margin: 15px; }
                            .no-print { display: none; }
                        }
                    </style>
                </head>
                <body>
                    <div class="header">
                        <h1>📋 ALL MEETING MINUTES</h1>
                        <div class="sub">Total: ${saved.length} entries | Printed: ${new Date().toLocaleString()}</div>
                    </div>
                    ${contentHtml}
                    <div style="text-align:center; color:#666; font-size:12px; margin-top:40px; border-top:1px solid #ddd; padding-top:20px;">
                        This is a computer-generated document.
                    </div>
                    <div class="no-print" style="text-align:center; margin-top:30px;">
                        <button onclick="window.print()" style="padding:10px 30px; cursor:pointer;">🖨️ Print All</button>
                        <button onclick="window.close()" style="padding:10px 30px; cursor:pointer; margin-left:10px;">Close</button>
                    </div>
                </body>
            </html>
        `);
        printWindow.document.close();
    };

    // ================================================================
    // EDIT MINUTE
    // ================================================================
    window.editMinute = function(id) {
        const saved = JSON.parse(localStorage.getItem('karacel_minutes') || '[]');
        const index = saved.findIndex(m => m.id === parseInt(id));
        if (index === -1) {
            alert('Minute not found.');
            return;
        }

        const item = saved[index];
        textarea.value = item.content;
        textarea.focus();

        // Remove the old entry and re-save when user saves
        saved.splice(index, 1);
        localStorage.setItem('karacel_minutes', JSON.stringify(saved));
        renderSavedMinutes(saved);

        setStatus('Editing: ' + item.date, true, '#00e0ff');

        // Change save button to indicate edit mode
        saveBtn.innerHTML = '<i class="fas fa-pen"></i> Update minutes';
        saveBtn.style.background = '#f5c542';
        saveBtn.onclick = function() {
            window.saveMinutes();
            saveBtn.innerHTML = '<i class="fas fa-check-circle"></i> Save minutes';
            saveBtn.style.background = '#00e0ff';
            saveBtn.onclick = window.saveMinutes;
        };
    };

    // ================================================================
    // DELETE MINUTE
    // ================================================================
    window.deleteMinute = function(id) {
        if (!confirm('Are you sure you want to delete this minute? This action cannot be undone.')) {
            return;
        }

        let saved = JSON.parse(localStorage.getItem('karacel_minutes') || '[]');
        saved = saved.filter(m => m.id !== parseInt(id));
        localStorage.setItem('karacel_minutes', JSON.stringify(saved));
        renderSavedMinutes(saved);
        setStatus('Deleted', true, '#ff6b6b');
    };

    // ================================================================
    // TOGGLE READ MORE / LESS
    // ================================================================
    window.toggleMinute = function(id) {
        const previewEl = document.getElementById(`preview_${id}`);
        const fullEl = document.getElementById(`full_${id}`);
        const toggleBtn = document.getElementById(`toggle_${id}`);

        if (!previewEl || !fullEl || !toggleBtn) return;

        if (previewEl.style.display === 'none') {
            previewEl.style.display = 'inline';
            fullEl.style.display = 'none';
            toggleBtn.innerHTML = '<i class="fas fa-chevron-down"></i> Read more';
        } else {
            previewEl.style.display = 'none';
            fullEl.style.display = 'inline';
            toggleBtn.innerHTML = '<i class="fas fa-chevron-up"></i> Read less';
        }
    };

    // ================================================================
    // HELPER FUNCTIONS
    // ================================================================
    function setStatus(msg, isSuccess = true, iconColor = '#4caf50') {
        statusText.textContent = msg;
        if (statusIcon) {
            statusIcon.style.color = iconColor;
        }
        if (msg !== 'Ready' && msg !== 'Saved!' && !msg.startsWith('Editing')) {
            setTimeout(() => {
                statusText.textContent = 'Ready';
                if (statusIcon) statusIcon.style.color = '#4caf50';
            }, 2800);
        } else if (msg === 'Saved!') {
            setTimeout(() => {
                statusText.textContent = 'Ready';
                if (statusIcon) statusIcon.style.color = '#4caf50';
            }, 2500);
        }
    }

    function escapeHtml(text) {
        if (!text) return '';
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return text.replace(/[&<>"']/g, function(m) { return map[m]; });
    }

    function clearTextarea() {
        textarea.value = '';
        textarea.focus();
        setStatus('Cleared', true, '#ffaa33');
        saveBtn.innerHTML = '<i class="fas fa-check-circle"></i> Save minutes';
        saveBtn.style.background = '#00e0ff';
        saveBtn.onclick = window.saveMinutes;
    }

    function loadSample() {
        const sample = `AGENDA – SPECIAL MEETING 21 AUG 2026

1. Call to order – 10:00 AM
2. Reading of previous minutes – approved
3. Treasurer's report – savings grew by 8%
4. Loan committee update – 12 new applications
5. Welfare: support for member family
6. Any other business
7. Adjournment – 12:15 PM

Prepared by: Secretary`;
        textarea.value = sample;
        setStatus('Sample loaded', true, '#00e0ff');
    }

    function loadSavedMinutes() {
        const saved = JSON.parse(localStorage.getItem('karacel_minutes') || '[]');
        window.renderSavedMinutes(saved);
    }

    // ================================================================
    // EVENT LISTENERS
    // ================================================================
    saveBtn.addEventListener('click', window.saveMinutes);
    clearBtn.addEventListener('click', clearTextarea);
    demoBtn.addEventListener('click', loadSample);
    loadSavedMinutes();

})();
</script>
{% endblock %}
