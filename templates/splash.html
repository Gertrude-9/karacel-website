<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karacel SACCO Association</title>

    <!-- Google Fonts for better typography -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='splash.css') }}">
    <script>
        // Smooth percentage counter
        document.addEventListener('DOMContentLoaded', function() {
            const percentageEl = document.getElementById('percentage');
            let startTime = Date.now();
            const duration = 8000; // matches animation duration

            function updatePercentage() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                // Ease out cubic for more natural feel
                const eased = 1 - Math.pow(1 - progress, 3);
                const percent = Math.round(eased * 100);
                if (percentageEl) {
                    percentageEl.textContent = percent + '%';
                }
                if (progress < 1) {
                    requestAnimationFrame(updatePercentage);
                }
            }

            updatePercentage();

            // Redirect after animation completes + small buffer
            setTimeout(() => {
                window.location.href = "/login";
            }, 9000);
        });
    </script>
</head>

<body>

    <!-- Floating particles background -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="container">
        <div class="card">

            <!-- Logo with animated rings -->
            <div class="logo-wrapper">
                <div class="logo-ring"></div>
                <div class="logo-ring"></div>
                <img 
                    src="{{ url_for('static', filename='images/karacel-logo.png') }}" 
                    alt="Karacel Association Logo" 
                    class="logo"
                >
            </div>

            <h1 class="title">Karacel Association</h1>
            <p class="subtitle">SACCO • Since 2017</p>

            <div class="divider"></div>

            <!-- Loading status -->
            <div class="loading-text">
                <span>Initializing System</span>
                <div class="loading-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>

            <!-- Progress bar -->
            <div class="loader-container">
                <div class="loader-track">
                    <div class="loader-fill"></div>
                </div>
                <div class="loader-percentage" id="percentage">0%</div>
            </div>

            <!-- Footer tagline -->
            <div class="tagline">
                <span>✦</span> &nbsp;Always There For You&nbsp; <span>✦</span>
            </div>

        </div>
    </div>

</body>
</html>
