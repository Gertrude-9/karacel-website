<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Account - 8Tech Bank</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='create_account.css') }}">
    
</head>
<body>

<div class="admin-wrapper">

    <!-- SIDEBAR -->
    <aside class="admin-sidebar">
        <div class="admin-sidebar-logo">
            <h2><i class="fas fa-microchip"></i> <span>8Tech Admin</span></h2>
        </div>

        <div class="admin-sidebar-nav">
            <a href="{{ url_for('admin_dashboard') }}" class="admin-nav-item">
                <i class="fas fa-tachometer-alt"></i> <span>Dashboard</span>
            </a>

            <a href="{{ url_for('admin_dashboard') }}" class="admin-nav-item">
                <i class="fas fa-users"></i> <span>Customers</span>
            </a>

            <a href="{{ url_for('create_account') }}" class="admin-nav-item active">
                <i class="fas fa-user-plus"></i> <span>Create Account</span>
            </a>

            <a href="{{ url_for('admin_dashboard') }}" class="admin-nav-item">
                <i class="fas fa-exchange-alt"></i> <span>Transactions</span>
            </a>

            <a href="{{ url_for('admin_dashboard') }}" class="admin-nav-item">
                <i class="fas fa-cog"></i> <span>Settings</span>
            </a>
        </div>

        <div class="sidebar-footer" style="padding: 20px;">
            <a href="{{ url_for('admin_logout') }}" class="logout-sidebar">
                <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
            </a>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="admin-main-content">

        <!-- MODERN APP BAR -->
        <div class="app-bar-modern">
            <div class="app-bar-title">
                <h2><i class="fas fa-user-plus"></i> Create Account</h2>
                <small>Register a new customer bank account</small>
            </div>
            <div class="admin-badge">
                <i class="fas fa-user-circle"></i>
                <span>Administrator</span>
            </div>
        </div>

        <!-- FORM SECTION -->
        <div style="display:flex; justify-content:center;">
            <div class="form-card">
                <div class="form-header">
                    <h3><i class="fas fa-id-card"></i> Account Details</h3>
                    <p>Fill in the customer information below</p>
                </div>

                <form method="POST">
                    <!-- Account Number -->
                    <div class="input-group-enhanced">
                        <label><i class="fas fa-hashtag"></i> Account Number</label>
                        <input type="text" name="account_number" placeholder="e.g., 8T-1001-0001" required>
                        
                    </div>

                    <!-- Customer Name -->
                    <div class="input-group-enhanced">
                        <label><i class="fas fa-user"></i> Customer Name</label>
                        <input type="text" name="account_name" placeholder="Full name of customer" required>
                    </div>

                    <!-- Email -->
                    <div class="input-group-enhanced">
                        <label><i class="fas fa-envelope"></i> Email Address</label>
                        <input type="email" name="email" placeholder="customer@example.com" required>
                        
                    </div>

                    <!-- Phone Number (NEW) -->
                    <div class="input-group-enhanced">
                        <label><i class="fas fa-phone-alt"></i> Phone Number</label>
                        <input type="tel" name="phone_number" placeholder="+256 7XX XXX XXX" required>
                        
                    </div>

                    <!-- Bank PIN -->
                    <div class="input-group-enhanced">
                        <label><i class="fas fa-lock"></i> Bank PIN</label>
                        <input type="password" name="bank_pin" placeholder="4-6 digit PIN" maxlength="6" required>
                        
                    </div>

                    <!-- Amount Row -->
                    <div class="input-row">
                        <div class="input-group-enhanced">
                            <label><i class="fas fa-money-bill-wave"></i> Opening Balance</label>
                            <input type="number" name="balance" placeholder="Amount" value="0" required>
                        </div>

                        <div class="input-group-enhanced">
                            <label><i class="fas fa-wallet"></i> Account Type</label>
                            <select name="account_type" required>
                                <option value="Savings Account">Savings Account</option>
                                <option value="Current Account">Current Account</option>
                                <option value="Premium Digital">Premium Digital</option>
                                <option value="Business Account">Business Account</option>
                            </select>
                        </div>
                    </div>

                    <!-- Branch Code -->
                    <div class="input-group-enhanced">
                        <label><i class="fas fa-building"></i> Branch Code</label>
                        <input type="text" name="branch_code" value="8TECH001" required>
                        
                    </div>

                    <button type="submit" class="create-btn">
                        <i class="fas fa-check-circle"></i> Create Account
                    </button>

                    <div class="security-note">
                        <i class="fas fa-shield-alt"></i> All information is encrypted and secure
                    </div>
                </form>
            </div>
        </div>

    </main>

</div>

<script>
    // Auto-generate account number if left empty (optional feature)
    const accountNumberInput = document.querySelector('input[name="account_number"]');
    const customerNameInput = document.querySelector('input[name="account_name"]');
    
    function generateAccountNumber() {
        if (!accountNumberInput.value) {
            const prefix = '8T';
            const random = Math.floor(Math.random() * 10000).toString().padStart(4, '0');
            const suffix = Math.floor(Math.random() * 10000).toString().padStart(4, '0');
            accountNumberInput.value = `${prefix}-${random}-${suffix}`;
        }
    }
    
    // Auto-generate account number on page load
    window.addEventListener('DOMContentLoaded', function() {
        generateAccountNumber();
    });
    
    // Optional: Format phone number as user types
    const phoneInput = document.querySelector('input[name="phone_number"]');
    if (phoneInput) {
        phoneInput.addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.startsWith('256') && value.length > 3) {
                value = '+' + value;
            } else if (value.startsWith('0') && value.length > 1) {
                value = '+256' + value.substring(1);
            }
            if (value.length > 13) value = value.substring(0, 13);
            e.target.value = value;
        });
    }
</script>

</body>
</html>
